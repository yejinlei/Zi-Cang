<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>諸子時間軸 · 子藏</title>
<link rel="stylesheet" href="css/common.css?v=22">
<style>
.page-title{margin-bottom:12px}
.era-nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.era-nav .chip{padding:5px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;background:var(--card-bg);color:var(--ink)}
.era-nav .chip.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.tl{position:relative;padding:12px 0 12px 0}
.tl::before{content:'';position:absolute;top:0;bottom:0;left:128px;width:2px;background:linear-gradient(180deg,var(--gold),transparent)}
.era-block{margin-bottom:24px}
.era-title{position:relative;padding:6px 0 6px 150px;font-size:18px;color:var(--gold);font-weight:600;margin-bottom:8px}
.era-title::before{content:'';position:absolute;left:122px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--gold)}
.tl-item{position:relative;padding:0 0 14px 150px}
.tl-item::before{content:'';position:absolute;left:128px;top:14px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--bg)}
.tl-item.person::before{background:#8B0000}
.tl-item.book::before{background:#2E5C3A}
.tl-item.event::before{background:#B8860B}
.tl-year{position:absolute;left:0;top:6px;width:120px;text-align:right;font-family:serif;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.tl-body{border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;background:var(--card-bg)}
.tl-body h4{margin:0 0 4px;font-size:15px}
.tl-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;margin-right:6px;color:#fff;vertical-align:middle}
.tl-tag.person{background:#8B0000}
.tl-tag.book{background:#2E5C3A}
.tl-tag.event{background:#B8860B}
.tl-body p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.8}
.tl-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tl-chips a{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--border);text-decoration:none;color:var(--muted);line-height:1.7}
.tl-chips a:hover{color:#fff}
.tl-chips a.tp{color:#8B0000;border-color:#8B000055}.tl-chips a.tp:hover{background:#8B0000}
.tl-chips a.tc{color:#2E5C3A;border-color:#2E5C3A55}.tl-chips a.tc:hover{background:#2E5C3A}
.tl-chips a.tt{color:#1d4e89;border-color:#1d4e8955}.tl-chips a.tt:hover{background:#1d4e89}
.tl-chips a.ti{color:var(--gold);border-color:var(--gold)55}.tl-chips a.ti:hover{background:var(--gold)}
.tl-chips a.ts{color:#6b3fa0;border-color:#6b3fa055}.tl-chips a.ts:hover{background:#6b3fa0}
</style>
</head>
<body>
<div class="container">
  <div id="siteNav"></div>
  <h1 class="page-title">諸子百家時間軸</h1>
  <p style="color:var(--muted);margin:0 0 8px">從西周初年到魏晉玄學，縱覽諸子人物生卒、典籍成書與重大事件的時序脈絡。</p>
  <div class="era-nav">
    <span class="chip active" data-era="all">全部</span>
    <span class="chip" data-era="春秋">春秋前</span>
    <span class="chip" data-era="戰國">戰國</span>
    <span class="chip" data-era="秦漢">秦漢</span>
    <span class="chip" data-era="漢以後">魏晉以降</span>
  </div>
  <div id="tl" class="tl"></div>
  <div id="siteFooter"></div>
</div>
<script src="data/people_ext.js?v=21"></script>
<script src="js/linkify.js?v=21"></script>
<script src="js/common.js?v=22"></script>
<script src="data/timeline.js?v=21"></script>
<script>
(function(){
  var data=window.TIMELINE_DATA||[];
  // 按 era 分組
  var eras=[
    {id:'春秋',title:'西周至春秋（-1046 ~ -476）',from:-1046,to:-476},
    {id:'戰國',title:'戰國百家爭鳴（-475 ~ -221）',from:-475,to:-221},
    {id:'秦漢',title:'秦漢百家合流（-220 ~ 220）',from:-220,to:220},
    {id:'漢以後',title:'玄學與終結（220 ~ 300）',from:220,to:300}
  ];
  function yearStr(y){ return y<0?'前'+(-y)+'年':y+'年'; }
  function render(era){
    var tl=document.getElementById('tl'); tl.innerHTML='';
    eras.forEach(function(e){
      var items=data.filter(function(d){
        var inEra=d.year>=e.from&&d.year<=e.to;
        if(!inEra) return false;
        if(era!=='all'){
          if(era==='春秋') return e.id==='春秋';
          if(era==='戰國') return e.id==='戰國';
          if(era==='秦漢') return e.id==='秦漢';
          if(era==='漢以後') return e.id==='漢以後';
        }
        return true;
      });
      if(!items.length) return;
      var block=document.createElement('div'); block.className='era-block';
      block.innerHTML='<div class="era-title">'+e.title+'（'+items.length+'條）</div>';
      items.forEach(function(d){
        var tagName=d.type==='person'?'人物':d.type==='book'?'典籍':'事件';
        var it=document.createElement('div'); it.className='tl-item '+d.type;
        // 为人物项加 id 便于锚点定位
        if(d.type==='person'&&d.pid){it.id='tl-p-'+d.pid;}
        function escLk(s){return linkify.text(String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));}
        // 从 title+desc 抽取相关实体生成 chips（去重、最多 8 个）
        var wholeText=(d.title||'')+' '+(d.desc||'');
        var hits={person:{},classic:{},term:{},idiom:{},school:{}};
        var lex=linkify.lexicon();
        // 按长度降序优先匹配长词
        lex.sort(function(a,b){return (b.name.length)-(a.name.length);});
        lex.forEach(function(e){
          if(!e.name||e.name.length<2) return;
          if(wholeText.indexOf(e.name)>=0){
            if(!hits[e.type][e.name]) hits[e.type][e.name]=e;
          }
        });
        // 若条目本身就是 person/book，则不要把同名作为"相关"重复列出
        var selfName=d.title.replace(/^《|》.*$/g,'').replace(/.*?([\u4e00-\u9fa5]{2,4})(生|卒|約|成書|遊|使|入|相|死).*/,'$1');
        function chipHref(e){
          if(e.type==='person') return linkify.personHref(e.id);
          if(e.type==='classic') return linkify.classicHref(e.name);
          if(e.type==='term') return 'terms.html#'+encodeURIComponent(e.name);
          if(e.type==='idiom') return 'idioms.html#'+encodeURIComponent(e.name);
          if(e.type==='school') return 'graph.html#school-'+encodeURIComponent(e.id||e.name);
          return '#';
        }
        function chipClass(t){return 't'+(t==='person'?'p':t==='classic'?'c':t==='term'?'t':t==='idiom'?'i':'s');}
        var chipsHtml='<div class="tl-chips no-link">';
        var chipCount=0;
        ['person','classic','term','school','idiom'].forEach(function(tp){
          Object.keys(hits[tp]).forEach(function(n){
            if(n===selfName && (tp==='person'||tp==='classic')) return;
            if(chipCount>=8) return;
            var e=hits[tp][n];
            chipsHtml+='<a href="'+chipHref(e)+'" class="'+chipClass(tp)+'">'+n+'</a>';
            chipCount++;
          });
        });
        chipsHtml+='</div>';
        it.innerHTML='<div class="tl-year no-link">'+yearStr(d.year)+'</div>'+
          '<div class="tl-body">'+
            '<h4><span class="tl-tag '+d.type+' no-link">'+tagName+'</span>'+escLk(d.title)+'</h4>'+
            '<p>'+escLk(d.desc)+'</p>'+
            (chipCount?chipsHtml:'')+
          '</div>';
        block.appendChild(it);
      });
      tl.appendChild(block);
    });
  }
  render('all');
  document.querySelectorAll('.era-nav .chip').forEach(function(c){
    c.addEventListener('click',function(){
      document.querySelectorAll('.era-nav .chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      render(c.dataset.era);
    });
  });
  // URL ?hl=pid / #era-XX 定位
  (function(){
    const params=new URLSearchParams(location.search);
    const hl=params.get('hl');
    const hash=location.hash.replace(/^#/,'');
    // era 切换
    if(hash.startsWith('era-')){
      const era=hash.replace(/^era-/,'');
      const btn=document.querySelector('.era-nav .chip[data-era="'+era+'"]');
      if(btn){btn.click();}
    }
    // hl 定位：按人物名匹配 tl-item，先按 name 映射
    if(hl){
      const PEOPLE_EXT=window.PEOPLE_EXT||{};
      const p=PEOPLE_EXT[hl];
      if(p){
        setTimeout(()=>{
          const items=[...document.querySelectorAll('.tl-item.person')];
          for(const it of items){
            const h4=it.querySelector('h4');
            if(!h4)continue;
            if(h4.textContent.includes(p.name)||h4.textContent.includes(p.name[0])){
              it.scrollIntoView({behavior:'smooth',block:'center'});
              it.style.boxShadow='0 0 0 3px var(--gold)';
              it.style.transition='box-shadow .4s';
              setTimeout(()=>{it.style.boxShadow='';},2500);
              break;
            }
          }
        },200);
      }
    }
  })();
})();
</script>
</body>
</html>

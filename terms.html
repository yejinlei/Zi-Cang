<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>諸子術語詞典 | 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=18">
<style>
  .tm-wrap { max-width:1240px; margin:0 auto; padding:24px 20px 70px; }
  .tm-title { font-family:"STKaiti",serif; font-size:34px; color:var(--ink); letter-spacing:3px; margin-bottom:6px; }
  .tm-sub { color:var(--ink-soft); font-size:14px; margin-bottom:20px; }

  .tm-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tm-search { flex:1; min-width:220px; padding:10px 16px; border:1px solid var(--border); border-radius:10px;
    background:var(--paper); color:var(--ink); font-size:15px; outline:none; }
  .tm-search:focus { border-color:var(--accent); }
  .cat-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .cat-tab { padding:7px 15px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
    background:var(--paper); color:var(--ink-soft); font-size:13px; font-family:"STKaiti",serif; transition:all .2s; }
  .cat-tab:hover { border-color:var(--accent); color:var(--accent); }
  .cat-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .tm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
  .tm-card { background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
  .tm-card:hover { border-color:var(--accent); box-shadow:0 6px 20px var(--shadow); }
  .tm-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .tm-name { font-family:"STKaiti",serif; font-size:26px; font-weight:700; color:var(--gold); letter-spacing:2px; }
  .tm-py { font-size:12px; color:var(--ink-soft); font-style:italic; }
  .tm-cat { font-size:11px; padding:2px 8px; border-radius:4px; background:var(--bg-soft); color:var(--accent); }
  .tm-school { font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }
  .tm-def { font-size:14px; color:var(--ink); line-height:1.8; margin:8px 0; }
  .tm-src { font-family:"STKaiti",serif; font-size:13.5px; color:var(--ink); border-left:3px solid var(--gold);
    padding:4px 0 4px 12px; margin:10px 0; line-height:1.7; background:var(--bg-soft); }
  .tm-views { margin-top:12px; border-top:1px dashed var(--border); padding-top:10px; }
  .tm-views h5 { font-size:12.5px; color:var(--accent); letter-spacing:1px; margin-bottom:8px; }
  .tm-view { display:flex; gap:8px; margin-bottom:7px; font-size:13px; line-height:1.7; }
  .tm-view .sch { flex:0 0 auto; font-family:"STKaiti",serif; color:#fff; background:var(--accent);
    padding:1px 8px; border-radius:4px; font-size:11.5px; height:fit-content; margin-top:2px; }
  .tm-view .vtx { color:var(--ink); }
  .tm-rel { margin-top:10px; }
  .tm-rel span { display:inline-block; font-size:11.5px; padding:2px 9px; margin:2px 3px 0 0; border-radius:999px;
    background:var(--bg-soft); color:var(--accent); border:1px solid var(--border); cursor:pointer; }
  .tm-rel span:hover { background:var(--accent); color:#fff; }
  .tm-count { font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .empty { text-align:center; padding:50px; color:var(--ink-soft); }
  @media(max-width:768px){ .tm-grid{grid-template-columns:1fr;} .tm-title{font-size:26px;} }
</style>
</head>
<body>
<div id="siteNav"></div>
<div class="page-wrap">
  <div class="tm-wrap">
    <div class="tm-title">諸子術語詞典</div>
    <div class="tm-sub">子藏核心範疇 83 條，逐條給出定義、出處與各家異解對照——同一術語在道、儒、墨、法、名各家筆下意涵迥異。</div>
    <div class="tm-bar">
      <input class="tm-search" id="q" placeholder="搜索術語、定義、出處…">
    </div>
    <div class="cat-tabs" id="tabs"></div>
    <div class="tm-count" id="count"></div>
    <div class="tm-grid" id="grid"></div>
  </div>
</div>
<div id="siteFooter"></div>

<script src="data/people_ext.js?v=18"></script>
<script src="js/linkify.js?v=18"></script>
<script src="js/common.js?v=18"></script>
<script src="data/terms.js?v=18"></script>
<script>
(function(){
  var D = window.TERMS_DATA || [];
  var CATS = ['全部'];
  D.forEach(function(t){ if(CATS.indexOf(t.cat)<0) CATS.push(t.cat); });
  var state = { cat:'全部', q:'' };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  document.getElementById('tabs').innerHTML = CATS.map(function(c,i){
    var n = c==='全部' ? D.length : D.filter(function(t){return t.cat===c;}).length;
    return '<div class="cat-tab'+(i===0?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' <span style="opacity:.65">'+n+'</span></div>';
  }).join('');

  function render(){
    var f = D.filter(function(t){
      if(state.cat!=='全部' && t.cat!==state.cat) return false;
      if(state.q){
        var hay = (t.name+' '+(t.pinyin||'')+' '+(t.def||'')+' '+(t.source||'')+' '+(t.school||'')+' '+
                   (t.views||[]).map(function(v){return v.school+v.view;}).join(' ')).toLowerCase();
        if(hay.indexOf(state.q.toLowerCase())<0) return false;
      }
      return true;
    });
    document.getElementById('count').textContent = '共 ' + f.length + ' 條術語';
    document.getElementById('grid').innerHTML = f.map(function(t){
      var h = '<div class="tm-card"><div class="tm-head">'+
        '<span class="tm-name no-link">'+esc(t.name)+'</span>'+
        '<span class="tm-py">'+esc(t.pinyin||'')+'</span>'+
        '<span class="tm-cat">'+esc(t.cat)+'</span></div>';
      h += '<div class="tm-school">主要歸屬：'+linkify.text(esc(t.school||''))+'</div>';
      h += '<div class="tm-def">'+linkify.text(esc(t.def||''))+'</div>';
      if(t.source) h += '<div class="tm-src">'+linkify.text(esc(t.source))+'</div>';
      if(t.views && t.views.length){
        h += '<div class="tm-views"><h5>各家異解（'+t.views.length+'）</h5>'+
          t.views.map(function(v){
            return '<div class="tm-view"><span class="sch no-link">'+esc(v.school)+'</span><span class="vtx">'+linkify.text(esc(v.view))+'</span></div>';
          }).join('')+'</div>';
      }
      if(t.related && t.related.length){
        h += '<div class="tm-rel no-link">'+t.related.map(function(r){
          return '<span data-jump="'+esc(r)+'">'+esc(r)+'</span>';
        }).join('')+'</div>';
      }
      return h+'</div>';
    }).join('') || '<div class="empty">未找到匹配的術語</div>';
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.cat-tab'); if(!t) return;
    document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active'); state.cat=t.dataset.cat; render();
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump]'); if(!t) return;
    state.cat='全部'; state.q=t.dataset.jump;
    document.getElementById('q').value = t.dataset.jump;
    document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.toggle('active', x.dataset.cat==='全部');});
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  var qT;
  document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(qT); qT=setTimeout(function(){ state.q=e.target.value.trim(); render(); },180);
  });
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語典故庫 | 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=20">
<style>
  .id-wrap { max-width:1240px; margin:0 auto; padding:24px 20px 70px; }
  .id-title { font-family:"STKaiti",serif; font-size:34px; color:var(--ink); letter-spacing:3px; margin-bottom:6px; }
  .id-sub { color:var(--ink-soft); font-size:14px; margin-bottom:20px; }

  .id-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .id-search { flex:1; min-width:220px; padding:10px 16px; border:1px solid var(--border); border-radius:10px;
    background:var(--paper); color:var(--ink); font-size:15px; outline:none; }
  .id-search:focus { border-color:var(--accent); }
  .cat-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .cat-tab { padding:7px 15px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
    background:var(--paper); color:var(--ink-soft); font-size:13px; font-family:"STKaiti",serif; transition:all .2s; }
  .cat-tab:hover { border-color:var(--accent); color:var(--accent); }
  .cat-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .id-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:16px; }
  .id-card { background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
  .id-card:hover { border-color:var(--accent); box-shadow:0 6px 20px var(--shadow); }
  .id-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .id-name { font-family:"STKaiti",serif; font-size:24px; font-weight:700; color:var(--gold); letter-spacing:2px; }
  .id-py { font-size:12px; color:var(--ink-soft); font-style:italic; }
  .id-src { font-size:12.5px; color:var(--accent); }
  .id-text { font-family:"STKaiti",serif; font-size:14px; color:var(--ink); line-height:1.85; padding:10px 14px;
    background:var(--bg-soft); border-radius:8px; margin:10px 0; }
  .id-mean { font-size:14px; color:var(--ink); line-height:1.8; }
  .id-mean b { color:var(--gold); }
  .id-tagrow { margin-top:10px; font-size:11.5px; color:var(--ink-soft); }
  .id-rel { margin-top:10px; }
  .id-rel span { display:inline-block; font-size:11.5px; padding:2px 9px; margin:2px 3px 0 0; border-radius:999px;
    background:var(--bg-soft); color:var(--accent); border:1px solid var(--border); cursor:pointer; }
  .id-rel span:hover { background:var(--accent); color:#fff; }
  .id-count { font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .empty { text-align:center; padding:50px; color:var(--ink-soft); }
  @media(max-width:768px){ .id-grid{grid-template-columns:1fr;} .id-title{font-size:26px;} }
</style>
</head>
<body>
<div id="siteNav"></div>
<div class="page-wrap">
  <div class="id-wrap">
    <div class="id-title">成語典故庫</div>
    <div class="id-sub">源出諸子典籍的成語 132 條，逐條標明典源篇章、原文、義訓與應用場景，並串聯同源典故。</div>
    <div class="id-bar">
      <input class="id-search" id="q" placeholder="搜索成語、典源、釋義…">
    </div>
    <div class="cat-tabs" id="tabs"></div>
    <div class="id-count" id="count"></div>
    <div class="id-grid" id="grid"></div>
  </div>
</div>
<div id="siteFooter"></div>

<script src="data/people_ext.js?v=20"></script>
<script src="js/linkify.js?v=20"></script>
<script src="js/common.js?v=20"></script>
<script src="data/idioms.js?v=20"></script>
<script>
(function(){
  var D = (window.IDIOMS_DATA||[]).filter(function(x){return x.name!=='其他';});
  function bookOf(src){
    var m = /《([^》·]+)/.exec(src||'');
    return m ? '《'+m[1]+'》' : (src||'其他');
  }
  var BOOKS = ['全部'];
  D.forEach(function(x){ var b=bookOf(x.src); if(BOOKS.indexOf(b)<0) BOOKS.push(b); });
  var state = { book:'全部', q:'' };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  document.getElementById('tabs').innerHTML = BOOKS.map(function(b,i){
    var n = b==='全部' ? D.length : D.filter(function(x){return bookOf(x.src)===b;}).length;
    return '<div class="cat-tab'+(i===0?' active':'')+'" data-book="'+esc(b)+'">'+esc(b)+' <span style="opacity:.65">'+n+'</span></div>';
  }).join('');

  function render(){
    var f = D.filter(function(x){
      if(state.book!=='全部' && bookOf(x.src)!==state.book) return false;
      if(state.q){
        var hay = (x.name+' '+(x.pinyin||'')+' '+(x.src||'')+' '+(x.text||'')+' '+(x.mean||'')+' '+(x.tag||'')+' '+(x.rel||[]).join(' ')).toLowerCase();
        if(hay.indexOf(state.q.toLowerCase())<0) return false;
      }
      return true;
    });
    document.getElementById('count').textContent = '共 ' + f.length + ' 條成語典故';
    document.getElementById('grid').innerHTML = f.map(function(x){
      var h = '<div class="id-card"><div class="id-head">'+
        '<span class="id-name no-link">'+esc(x.name)+'</span>'+
        '<span class="id-py">'+esc(x.pinyin||'')+'</span>'+
        '<span class="id-src">'+linkify.text(esc(x.src||''))+'</span></div>';
      if(x.text) h += '<div class="id-text">'+linkify.text(esc(x.text))+'</div>';
      h += '<div class="id-mean">'+linkify.text(esc(x.mean||''))+'</div>';
      if(x.tag) h += '<div class="id-tagrow">類別：'+esc(x.tag)+'</div>';
      if(x.rel && x.rel.length){
        h += '<div class="id-rel no-link">'+x.rel.map(function(r){
          return '<span data-jump="'+esc(r)+'">'+esc(r)+'</span>';
        }).join('')+'</div>';
      }
      return h+'</div>';
    }).join('') || '<div class="empty">未找到匹配的成語</div>';
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.cat-tab'); if(!t) return;
    document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active'); state.book=t.dataset.book; render();
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump]'); if(!t) return;
    state.book='全部'; state.q=t.dataset.jump;
    document.getElementById('q').value = t.dataset.jump;
    document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.toggle('active', x.dataset.book==='全部');});
    render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  var qT;
  document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(qT); qT=setTimeout(function(){ state.q=e.target.value.trim(); render(); },180);
  });
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<script id="fouc-theme">!function(){try{var t=localStorage.getItem("zicang-theme")||"xingxiang",v=localStorage.getItem("zicang-theme-ver");if(v!=="v29-deepsky")t="xingxiang";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","xingxiang")}}();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全文庫 | 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=35">
<style>
.lib-wrap { max-width:1280px; margin:0 auto; padding:24px 28px 60px; }
  .lib-title { font-family:"STKaiti","KaiTi",serif; font-size:36px; color:var(--gold-bright); margin:30px 0 6px; letter-spacing:6px; text-align:center; }
  .lib-sub { color:var(--ink-3); font-size:14px; margin-bottom:28px; letter-spacing:2px; text-align:center; }
  
  /* 检索区 */
  .lib-tools { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .lib-search {
    flex:1; max-width:600px; min-width:240px; padding:12px 20px;
    background:var(--card-solid); color:var(--ink);
    border:1px solid var(--border); border-radius:10px;
    font-size:15px; outline:none; transition:all .2s;
    backdrop-filter:blur(8px);
  }
  .lib-search:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,176,121,.1); }
  .lib-search::placeholder { color:var(--ink-3); }
  
  /* 分类标签 */
  .cat-tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
  .cat-tab {
    padding:9px 20px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
    background:var(--card-solid); color:var(--ink-2); font-size:14px; transition:all .2s;
    font-family:"STKaiti",serif; letter-spacing:2px;
    backdrop-filter:blur(8px);
  }
  .cat-tab:hover { border-color:var(--gold); color:var(--gold-bright); background:rgba(212,176,121,.08); }
  .cat-tab.active { background:linear-gradient(135deg,var(--zhu),var(--zhu-deep)); color:#fff; border-color:var(--zhu); box-shadow:0 2px 12px rgba(217,74,74,.35); }
  .cat-tab .count { font-size:12px; opacity:.7; margin-left:4px; }
  
  /* 书目列表 */
  .book-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; }
  .book-item {
    display:flex; align-items:center; gap:12px; padding:13px 18px;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    text-decoration:none; color:var(--ink); transition:all .25s; cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .book-item:hover { border-color:rgba(212,176,121,.35); transform:translateY(-2px); box-shadow:var(--shadow),var(--glow); }
  .book-cat {
    display:inline-block; padding:3px 10px; border-radius:4px; font-size:12px;
    background:rgba(212,176,121,.1); color:var(--gold); white-space:nowrap;
    font-family:"STSong",serif; min-width:36px; text-align:center;
    letter-spacing:1px; border:1px solid var(--border-soft);
  }
  .book-name {
    flex:1; font-size:15px; color:var(--gold-bright); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; font-family:"STKaiti",serif;
    letter-spacing:1px; font-weight:600;
  }
  .book-vol { color:var(--ink-2); font-size:12px; letter-spacing:1px; }
  .book-chars { color:var(--gold); font-size:12px; white-space:nowrap; letter-spacing:1px; opacity:.85; }
  
  /* 分页加载 */
  .load-more {
    margin:30px auto 0; display:block; padding:11px 36px;
    border:1px solid var(--border-strong);
    background:transparent; color:var(--gold); border-radius:8px; cursor:pointer; font-size:14px;
    font-family:"STKaiti",serif; transition:all .2s; letter-spacing:3px;
  }
  .load-more:hover { background:rgba(212,176,121,.12); border-color:var(--gold); color:var(--gold-bright); }
  
  /* 统计 */
  .stat-bar {
    padding:14px 22px; background:var(--card); border-radius:10px; margin-bottom:20px;
    display:flex; gap:24px; color:var(--ink-2); font-size:14px; flex-wrap:wrap; justify-content:center;
    border:1px solid var(--border); backdrop-filter:blur(6px);
    letter-spacing:2px;
  }
  .stat-bar strong { color:var(--gold-bright); font-size:22px; font-family:"STKaiti",serif; margin-right:6px; font-weight:700; text-shadow:0 0 12px rgba(212,176,121,.3); }
  
  /* 空状态 */
  .empty { text-align:center; padding:80px 20px; color:var(--ink-3); }
  
  @media (max-width:768px){
    .lib-wrap{padding:20px 16px 40px;}
    .lib-title { font-size:26px; letter-spacing:3px; }
    .book-list { grid-template-columns:1fr; }
    .stat-bar{gap:12px;padding:12px 14px;}
    .stat-bar strong{font-size:18px;}
  }
</style>
</head>
<body>
<div id="siteNav"></div>
<div class="page-wrap">

<div class="lib-wrap">
  <h1 class="lib-title">📚 子部全文庫</h1>
  <p class="lib-sub">按字數倒序排列 · 點擊典籍名進入閱讀 · 子學核心概念自動標註</p>
  
  <div class="lib-tools">
    <input type="text" class="lib-search" id="searchInput" placeholder="🔍 搜索書名… 如：莊子、孫子兵法、太平御覽">
  </div>
  
  <div class="stat-bar" id="statBar">正在加载書目…</div>
  
  <div class="cat-tabs" id="catTabs"></div>
  
  <div class="book-list" id="bookList"></div>
  <button class="load-more" id="loadMore" style="display:none" onclick="loadMore()">加載更多 ▾</button>
</div>

<script src="js/common.js?v=35"></script>
<script>
let ALL_BOOKS = [];
const CAT_ORDER = ['all','诸子','兵家','法家','农家','算学','笔记','类书'];
const CAT_NAMES = {all:'全部',诸子:'诸子',兵家:'兵家',法家:'法家',农家:'农家',算学:'算学',笔记:'笔记',类书:'类书'};
let currentCategory = 'all';
let currentPage = 0;
const pageSize = 100;

async function init(){
  try{
    const resp = await fetch('data/books.json?v=27',{cache:'no-cache'});
    if(!resp.ok) throw new Error('书目加载失败: '+resp.status);
    ALL_BOOKS = await resp.json();
    renderStats();
    renderCategories();
    renderBooks();
  }catch(e){
    document.getElementById('statBar').innerHTML = '<span style="color:var(--accent)">書目加載失敗：'+e.message+'，請刷新重試</span>';
  }
}

function renderStats(){
  const totalBooks = ALL_BOOKS.length;
  const totalChars = ALL_BOOKS.reduce((s,b)=>s+(b.chars||0),0);
  const multiVol = ALL_BOOKS.filter(b=>b.volumes>1).length;
  let html = '<span><strong>'+totalBooks+'</strong>部典籍</span>';
  html += '<span><strong>'+formatChars(totalChars)+'</strong>字</span>';
  html += '<span><strong>'+multiVol+'</strong>部多卷本</span>';
  html += '<span><strong>7</strong>個分類</span>';
  document.getElementById('statBar').innerHTML = html;
}

function renderCategories(){
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = '';
  CAT_ORDER.forEach(cat=>{
    const count = cat==='all' ? ALL_BOOKS.length : ALL_BOOKS.filter(b=>b.catName===cat||b.category===cat).length;
    const tab = document.createElement('div');
    tab.className = 'cat-tab'+(cat===currentCategory?' active':'');
    tab.innerHTML = CAT_NAMES[cat]+'<span class="count">'+count+'</span>';
    tab.onclick = ()=>{
      currentCategory = cat;
      currentPage = 0;
      document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('bookList').innerHTML = '';
      renderBooks();
    };
    tabs.appendChild(tab);
  });
}

function getFiltered(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = ALL_BOOKS;
  if(currentCategory!=='all'){
    filtered = filtered.filter(b=>b.catName===currentCategory||b.category===currentCategory);
  }
  if(search){
    filtered = filtered.filter(b=>b.title.toLowerCase().includes(search));
  }
  return filtered;
}

function renderBooks(){
  const list = document.getElementById('bookList');
  const filtered = getFiltered();
  const start = currentPage*pageSize;
  const end = Math.min(start+pageSize, filtered.length);
  for(let i=start;i<end;i++){
    const b = filtered[i];
    const item = document.createElement('a');
    item.className = 'book-item';
    item.href = 'reader.html?b='+b.file;
    const volTag = b.volumes>1 ? '<span class="book-vol">'+b.volumes+'卷</span>' : '';
    item.innerHTML =
      '<span class="book-cat">'+(b.catName||b.category)+'</span>'+
      '<span class="book-name">'+b.title+'</span>'+
      volTag+
      '<span class="book-chars">'+formatChars(b.chars)+'字</span>';
    list.appendChild(item);
  }
  const loadBtn = document.getElementById('loadMore');
  if(end < filtered.length){
    loadBtn.style.display = 'block';
    loadBtn.textContent = '加載更多 ▾ （'+(filtered.length-end)+'部未顯示）';
  }else{
    loadBtn.style.display = 'none';
  }
  if(filtered.length===0){
    list.innerHTML = '<div class="empty">未找到匹配的典籍</div>';
  }
}

function loadMore(){
  currentPage++;
  renderBooks();
}

function formatChars(n){
  if(!n) return '';
  if(n<10000) return n.toLocaleString();
  if(n<100000000) return (n/10000).toFixed(1)+'萬';
  return (n/100000000).toFixed(2)+'億';
}

document.getElementById('searchInput').addEventListener('input',()=>{
  currentPage=0;
  document.getElementById('bookList').innerHTML='';
  renderBooks();
});

init();
</script>
</div><!-- /page-wrap -->
<div id="siteFooter"></div>
</body>
</html>

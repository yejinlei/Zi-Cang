<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>典籍閱讀 · 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=7">
<style>
  body{background:var(--paper);color:var(--ink);margin:0;font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;line-height:1.8;overflow-x:hidden}
  .reader-wrap{max-width:860px;margin:0 auto;padding:24px 28px 120px}
  .reader-toolbar{position:sticky;top:64px;z-index:20;background:var(--paper);border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tool-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.9em;transition:all .2s;white-space:nowrap}
  .tool-btn:hover{border-color:var(--gold);color:var(--gold)}
  .tool-btn.on{background:var(--gold);color:var(--paper);border-color:var(--gold)}
  .tool-select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.9em;cursor:pointer}
  .reader-search{flex:1;min-width:140px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.9em;outline:none}
  .reader-search:focus{border-color:var(--gold)}
  .reader-title{font-size:1.8em;font-weight:700;margin:8px 0 6px;text-align:center;letter-spacing:.1em;color:var(--ink)}
  .reader-meta{text-align:center;color:var(--sub);font-size:.9em;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .reader-content{font-size:1.08em;line-height:2.0;color:var(--ink)}
  .reader-content p{margin:0;text-indent:2em;padding:4px 0}
  .reader-content.vertical{writing-mode:vertical-rl;max-width:none;height:calc(100vh - 130px);padding:0 20px;overflow-x:auto;overflow-y:hidden}
  .reader-content h3{font-size:1.2em;font-weight:700;text-align:center;margin:32px 0 16px;color:var(--gold);letter-spacing:.1em}
  .reader-content .juanname{text-align:center;color:var(--accent);font-size:1.05em;margin:24px 0 10px;font-weight:600}
  .reader-content mark{background:#ffeb99;color:#8b2500;padding:1px 3px;border-radius:3px}
  .reader-content a.concept{color:var(--gold);border-bottom:1px dashed var(--gold);cursor:help;text-decoration:none}
  .font-small .reader-content{font-size:.95em}
  .font-normal .reader-content{font-size:1.08em}
  .font-large .reader-content{font-size:1.22em}
  .progress-bar{position:fixed;top:63px;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--accent));z-index:30;transition:width .15s}
  .toc-panel{position:fixed;left:-340px;top:64px;bottom:0;width:320px;background:var(--card);border-right:1px solid var(--border);z-index:40;transition:left .3s;overflow-y:auto;padding:16px;box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .toc-panel.open{left:0}
  .toc-panel h3{margin:0 0 12px;font-size:1.1em;color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .toc-item{padding:6px 10px;cursor:pointer;border-radius:6px;color:var(--ink);font-size:.94em;display:block;text-decoration:none;transition:all .15s}
  .toc-item:hover{background:rgba(139,37,0,.08);color:var(--gold)}

  .toc-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39;display:none}

  .loader-wrap{text-align:center;padding:60px 20px;color:var(--sub)}

  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-text{margin-top:10px;font-size:.92em}
  .progress-bar-inner{width:280px;max-width:80vw;height:4px;background:var(--border);border-radius:2px;margin:16px auto 6px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));width:0%;transition:width .2s;border-radius:2px}
  .err-box{text-align:center;padding:60px 20px;color:var(--sub)}

  .err-btn{padding:10px 22px;border-radius:8px;background:var(--gold);color:var(--paper);border:none;cursor:pointer;font-family:inherit;margin:10px 6px;font-size:.95em}

  .toast.show{opacity:.95}
  @media(max-width:720px){
    .reader-wrap{padding:16px 16px 80px}
    .reader-title{font-size:1.4em}

    .tool-btn{padding:6px 10px;font-size:.85em}
  }
</style>

<body class="font-normal">
<div id="siteNav"></div>
<div class="progress-bar" id="progressBar" style="width:0%"></div>
<div class="toc-mask" id="tocMask" onclick="closeToc()"></div>
<div class="toc-panel" id="tocPanel"><h3>📋 篇目導航</h3><div id="tocList"></div></div>

<div class="reader-wrap">
  <div class="reader-toolbar">
    <button class="tool-btn" onclick="toggleToc()">📋 目錄</button>
    <button class="tool-btn" id="favBtn" onclick="toggleFav()">☆ 收藏</button>
    <select class="tool-select" id="volSelect" style="display:none" onchange="switchVol(this.value)"></select>
    <input class="reader-search" id="bookSearch" placeholder="本書內搜索…" onkeydown="if(event.key==='Enter')inBookSearch(this.value)">
    <button class="tool-btn" id="tradBtn" onclick="toggleSimp()">繁</button>
    <button class="tool-btn" onclick="decFont()">A-</button>
    <button class="tool-btn" onclick="incFont()">A+</button>
    <button class="tool-btn" id="vertBtn" onclick="toggleVert()">竪</button>
    <button class="tool-btn" onclick="citeExport()">📋 引用</button>
  </div>
  <h1 class="reader-title" id="bookTitle">載入中…</h1>
  <div class="reader-meta" id="bookMeta"></div>
  <div id="loader" class="loader-wrap">
    <div class="spinner"></div>
    <div class="progress-text" id="loadText">正在連接文本…</div>
    <div class="progress-bar-inner"><div class="progress-fill" id="loadProgress"></div></div>
  </div>
  <article class="reader-content" id="content" style="display:none"></article>
</div>
<div class="toast" id="toast"></div>

<script src="js/common.js?v=7"></script>
<script>
// ========== 核心状态 ==========
const params = new URLSearchParams(location.search);
const fileParam = params.get('b');
const decodedPath = fileParam ? decodeURIComponent(fileParam) : '';
// 统一加 texts/ 前缀（如果还没有的话）
const TEXT_ROOT = 'texts/';
function resolvePath(p){
  if(!p) return '';
  const decoded = decodeURIComponent(p);
  return decoded.startsWith('texts/') ? decoded : TEXT_ROOT + decoded;
}
let rawText = '', bookName = '', chapters = [], curVol = 0, volumes = [];
let isSimplified = false, isVertical = false, currentFontSize = 0, currentHTML = '';

// ========== 概念高亮：预编译为单个正则（O(n) 而非 O(n×36)） ==========
const CONCEPTS = ['道','无为','自然','仁','义','礼','智','信','兼爱','非攻','尚贤','法','术','势','刑名','奇正','虚实','庙算','白马非马','坚白','齐物','逍遥','性善','性恶','四端','浩然之气','仁政','王霸','义利','天人合一','知行合一','中庸','格物','致知','名实','正名'];
// 按长度降序，避免"白马"被"白"先匹配
const SORTED_CONCEPTS = CONCEPTS.slice().sort((a,b)=>b.length-a.length);
const CONCEPT_RE = new RegExp('('+SORTED_CONCEPTS.map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
// 章节识别正则（单次匹配，O(n)）
const CHAPTER_RE = /^(卷[一二三四五六七八九十百千零\d]+|第[一二三四五六七八九十百千\d]+[篇卷章回節]|[\u4e00-\u9fa5]{1,12}(篇|章|序|論|說|解|記|訓|傳|語|策|略)|[一二三四五六七八九十百千]+、|[【\[〔].{2,20}[】\]〕])\s*$/;
// 字数格式化
function fmtChars(n){return n>=10000?(n/10000).toFixed(1)+'萬':n.toString();}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
function setProgress(pct){
  document.getElementById('loadProgress').style.width = Math.min(100,pct)+'%';
}
function setStatus(msg){document.getElementById('loadText').textContent=msg;}

function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ========== 加载 books.json ==========
let BOOKS = [];
async function loadBooksInfo(){
  try{
    const r = await fetch('data/books.json?v=7',{cache:'force-cache'});
    if(!r.ok) return null;
    BOOKS = await r.json();
    return BOOKS;
  }catch(e){return null;}
}

// ========== 解析章节（一次遍历，O(n)） ==========
function parseChapters(text){
  const chs=[];
  const lines=text.split('\n');
  let pos=0, idx=0;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();
    if(ln && ln.length<=20 && CHAPTER_RE.test(ln)){
      chs.push({title:ln, pos, index:idx++});
    }
    pos+=lines[i].length+1;
  }
  return chs;
}

// ========== 构建目录 ==========
function buildToc(){
  const list=document.getElementById('tocList');
  if(!chapters.length){
    list.innerHTML='<div style="color:var(--sub);font-size:.9em;padding:8px">本卷未識別到標準篇章標題，可使用書內搜索定位</div>';
    return;
  }
  let html='';
  chapters.forEach((c,i)=>{
    const isJuan=/^卷/.test(c.title);
    html+=`<a class="toc-item${isJuan?' juan':''}" onclick="jumpCh(${i})">${c.title}</a>`;
  });
  list.innerHTML=html;
}
function jumpCh(i){
  const el=document.getElementById('ch_'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  closeToc();
}
function toggleToc(){
  document.getElementById('tocPanel').classList.toggle('open');
  document.getElementById('tocMask').classList.toggle('show');
}
function closeToc(){
  document.getElementById('tocPanel').classList.remove('open');
  document.getElementById('tocMask').classList.remove('show');
}

// ========== 核心：高性能格式化（单次拼接，无正则循环） ==========
function formatText(text){
  const lines = text.split('\n');
  const chSet = new Set(chapters.map(c=>c.title));
  let chIdx=0;
  let out='';
  for(let i=0;i<lines.length;i++){
    const raw = lines[i];
    const ln = raw.trim();
    if(!ln) continue;
    // 章节标题（按出现顺序匹配，避免重名错位）
    if(chIdx<chapters.length && chapters[chIdx].title===ln){
      const tag = /^卷/.test(ln)?'div class="juanname"':'h3';
      const cls = tag.includes('div')?'juanname':'';
      out+=`<${tag} id="ch_${chIdx}">${ln}</${tag.startsWith('div')?'div':'h3'}>`;
      chIdx++; continue;
    }
    // 段落：转义+概念高亮（单个正则完成全部36概念）
    const safe = escapeHTML(ln);
    const highlighted = safe.replace(CONCEPT_RE,'<a class="concept" title="子學核心概念: $1">$1</a>');
    out+=`<p>${highlighted}</p>`;
  }
  return out;
}

// ========== 渲染：先插入，再分批追加避免长任务阻塞 ==========
async function renderText(text){
  const ct=document.getElementById('content');
  const loader=document.getElementById('loader');
  setStatus('正在解析…'); setProgress(70);
  
  chapters = parseChapters(text);
  buildToc();
  
  setStatus('正在渲染…'); setProgress(80);
  
  // 对超大型文本（>1MB）做分批渲染；中小文本一次性
  const isBig = text.length > 1000000;
  if(isBig){
    // 按段落分组，每批约8万字符
    const lines = text.split('\n');
    const batches=[];
    let batch=[], bsize=0;
    const BATCH=80000;
    for(const line of lines){
      batch.push(line); bsize+=line.length;
      if(bsize>=BATCH){batches.push(batch);batch=[];bsize=0;}
    }
    if(batch.length) batches.push(batch);
    
    ct.innerHTML=''; ct.style.display='block';
    let chIdx=0;
    let rendered=0;
    for(let bi=0;bi<batches.length;bi++){
      let html='';
      for(const raw of batches[bi]){
        const ln=raw.trim();
        if(!ln) continue;
        if(chIdx<chapters.length && chapters[chIdx].title===ln){
          const isJuan=/^卷/.test(ln);
          html+=isJuan
            ?`<div class="juanname" id="ch_${chIdx}">${ln}</div>`
            :`<h3 id="ch_${chIdx}">${ln}</h3>`;
          chIdx++; continue;
        }
        const safe=escapeHTML(ln);
        const hl=safe.replace(CONCEPT_RE,'<a class="concept" title="子學核心概念: $1">$1</a>');
        html+=`<p>${hl}</p>`;
      }
      ct.insertAdjacentHTML('beforeend',html);
      rendered += batches[bi].reduce((s,l)=>s+l.length,0);
      setProgress(80 + (rendered/text.length)*18);
      // 每批让出一次主线程
      await new Promise(r=>requestAnimationFrame(()=>r()));
    }
    currentHTML = ct.innerHTML;
  }else{
    currentHTML = formatText(text);
    ct.innerHTML = currentHTML;
  }
  
  setProgress(98); setStatus('完成');
  loader.style.display='none';
  setProgress(100);
  updateProgress();
}

// ========== 下载文本（带进度、缓存、超时） ==========
async function loadText(fullPath){
  const loader=document.getElementById('loader');
  const ct=document.getElementById('content');
  loader.style.display='block';
  ct.style.display='none';
  setProgress(0); setStatus('正在下載文本…');

  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(),90000);
  try{
    const r = await fetch(fullPath, {signal:ctrl.signal, cache:'force-cache'});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status+' ('+fullPath+')');
    
    // 流式下载进度
    const reader = r.body.getReader();
    const contentLength = +(r.headers.get('Content-Length')||0);
    let received=0, chunks=[];
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      chunks.push(value);
      received += value.length;
      if(contentLength>0){
        setProgress(Math.min(65, (received/contentLength)*65));
        setStatus(`下載中… ${(received/1048576).toFixed(1)}MB`);
      }else{
        setStatus(`下載中… ${(received/1048576).toFixed(1)}MB`);
      }
    }
    setProgress(68); setStatus('正在解碼…');
    
    // 拼接Uint8Array并解码
    let all = new Uint8Array(received);
    let pos=0;
    for(const c of chunks){all.set(c,pos); pos+=c.length;}
    const text = new TextDecoder('utf-8').decode(all);
    
    rawText = text.replace(/\r/g,'');
    setProgress(70);
    await renderText(rawText);
  }catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError'){
      showError('下載超時（90秒），請檢查網絡后重試',fullPath);
    }else{
      showError('文本加載失敗: '+e.message,fullPath);
    }
  }
}

// ========== 书内搜索 ==========
let searchMarks=[];
function clearMarks(){
  const ct=document.getElementById('content');
  ct.querySelectorAll('mark').forEach(m=>{
    const parent=m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent),m);
    parent.normalize();
  });
  searchMarks=[];
}
function inBookSearch(q){
  clearMarks();
  q=(q||'').trim();
  if(!q){toast('已清除標記');return;}
  const ct=document.getElementById('content');
  // 用TreeWalker遍历文本节点，避免破坏DOM结构
  const walker = document.createTreeWalker(ct, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n;
  while(n=walker.nextNode()){
    if(n.parentNode.nodeName==='MARK') continue;
    const txt=n.textContent;
    if(txt.includes(q)) nodes.push({node:n, idx:txt.indexOf(q)});
  }
  if(!nodes.length){toast('本書未找到 "'+q+'"');return;}
  // 只高亮前200个避免大结果卡死
  const maxH = Math.min(nodes.length,200);
  for(let i=0;i<maxH;i++){
    const {node,idx} = nodes[i];
    const range = document.createRange();
    range.setStart(node,idx);
    range.setEnd(node,idx+q.length);
    const mark = document.createElement('mark');
    try{range.surroundContents(mark);}catch(e){}
  }
  // 跳转到第一个
  if(nodes[0]){
    const firstMark = ct.querySelector('mark');
    if(firstMark) firstMark.scrollIntoView({behavior:'smooth',block:'center'});
  }
  toast(`找到 ${nodes.length} 處${nodes.length>maxH?'（僅高亮前'+maxH+'處）':''}`);
}

// ========== 工具栏功能 ==========
function toggleSimp(){
  isSimplified=!isSimplified;
  const ct=document.getElementById('content');
  const btn=document.getElementById('tradBtn');
  if(isSimplified){
    // 只对纯文本节点转换，避免破坏概念链接
    const walker=document.createTreeWalker(ct,NodeFilter.SHOW_TEXT,null);
    const texts=[];let n;
    while(n=walker.nextNode())texts.push(n);
    texts.forEach(tn=>{tn.textContent=t2s(tn.textContent);});
    btn.textContent='简';btn.classList.add('on');
  }else{
    // 重新渲染恢复繁体
    ct.innerHTML=currentHTML;
    btn.textContent='繁';btn.classList.remove('on');
  }
}
function incFont(){currentFontSize=Math.min(2,currentFontSize+1);applyFont();}
function decFont(){currentFontSize=Math.max(-1,currentFontSize-1);applyFont();}
function applyFont(){
  document.body.className = (currentFontSize<0?'font-small':currentFontSize>0?'font-large':'font-normal')+(isVertical?'':'');
}
function toggleVert(){
  isVertical=!isVertical;
  const ct=document.getElementById('content');
  const btn=document.getElementById('vertBtn');
  if(isVertical){ct.classList.add('vertical');btn.classList.add('on');toast('已切換豎排');}
  else{ct.classList.remove('vertical');btn.classList.remove('on');toast('已切換橫排');}
}
function toggleFav(){
  const added = toggleFav(decodedPath,bookName);
  updateFavBtn();
  toast(added?'已加入收藏':'已取消收藏');
}
function updateFavBtn(){
  const btn=document.getElementById('favBtn');
  if(isFav(decodedPath)){btn.classList.add('on');btn.innerHTML='★ 已收藏';}
  else{btn.classList.remove('on');btn.innerHTML='☆ 收藏';}
}
function citeExport(){
  const url = location.origin + location.pathname + '?b=' + encodeURIComponent(decodedPath);
  const template=`[${bookName}]//子藏本體論 Zi-Cang Ontology[EB/OL]. (2026). ${url}`;
  navigator.clipboard?.writeText(template)
    .then(()=>toast('引用信息已複製'))
    .catch(()=>prompt('複製以下引用格式：',template));
}
function switchVol(i){
  curVol=parseInt(i);
  loadText(volumes[curVol]);
  // 更新URL（不刷新页面）
  const newUrl = location.pathname+'?b='+encodeURIComponent(volumes[curVol].replace(TEXT_ROOT,''));
  history.replaceState(null,'',newUrl);
  // 更新标题
  document.title=bookName+'（第'+(curVol+1)+'卷）· 子藏本體論';
}
function updateProgress(){
  const h=document.documentElement;
  const pct = h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100;
  document.getElementById('progressBar').style.width=pct+'%';
  if(decodedPath) saveProgress(decodedPath, h.scrollTop);
}
function showError(msg,path){
  document.getElementById('loader').innerHTML=`<div class="err-box">
    <h2>⚠ 無法載入文本</h2><p>${msg}</p>
    ${path?`<p style="font-size:.82em;opacity:.7;word-break:break-all">路徑: ${escapeHTML(path)}</p>`:''}
    <button class="err-btn" onclick="history.back()">← 返回書庫</button>
    <button class="err-btn" onclick="location.reload()">重試</button>
  </div>`;
}

// ========== 初始化 ==========
async function init(){
  if(!decodedPath){showError('未指定書籍路徑');return;}
  
  bookName = decodedPath.split('/').pop().replace(/\.txt$/,'').replace(/_卷\d+$/,'');
  document.title = bookName+' · 子藏本體論';
  document.getElementById('bookTitle').textContent = bookName;
  
  const books = await loadBooksInfo();
  const cat = decodedPath.split('/')[0]||'';
  const fname = decodedPath.split('/').pop();
  let bookInfo=null;
  if(BOOKS.length){
    const encFile = encodeURI(decodedPath);
    bookInfo = BOOKS.find(b=>b.file===encFile)
      || BOOKS.find(b=>b.volFiles && b.volFiles.includes(encFile))
      || BOOKS.find(b=>b.title===bookName);
    if(bookInfo){
      const chars = fmtChars(bookInfo.chars||0);
      document.getElementById('bookMeta').textContent = `${bookInfo.catName} · ${chars}字${bookInfo.volumes>1?' · 共'+bookInfo.volumes+'卷':''}`;
      if(bookInfo.volFiles && bookInfo.volFiles.length>1){
        volumes = bookInfo.volFiles.map(encodeFullPath);
        // 定位当前卷
        const curEnc = encodeURI(decodedPath);
        curVol = bookInfo.volFiles.findIndex(v=>v===curEnc);
        if(curVol<0) curVol=0;
        const sel=document.getElementById('volSelect');
        sel.style.display='inline-block';
        sel.innerHTML = bookInfo.volFiles.map((v,i)=>
          `<option value="${i}" ${i===curVol?'selected':''}>第${i+1}卷</option>`).join('');
      }else{
        volumes = [resolvePath(decodedPath)];
      }
    }else{
      volumes = [resolvePath(decodedPath)];
    }
  }else{
    volumes = [resolvePath(decodedPath)];
  }
  
  // 恢复阅读位置
  const saved = getProgress(decodedPath);
  const loadPath = volumes[curVol]||volumes[0];
  await loadText(loadPath);
  updateFavBtn();
  if(saved>0){setTimeout(()=>{window.scrollTo(0,Math.min(saved,document.documentElement.scrollHeight-100));updateProgress();},200);}
  window.addEventListener('scroll',updateProgress,{passive:true});
}

function encodeFullPath(enc){
  // enc是URL编码形式如 %E7%B1%BB%E4%B9%A6/xxx.txt
  const dec = decodeURIComponent(enc);
  return TEXT_ROOT + dec;
}

init();
</script>
<div id="siteFooter"></div>
</body>
</html>

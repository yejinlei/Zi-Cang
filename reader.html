<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>典籍閱讀 · 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=4">
<style>
  :root{--ink:#2c1810;--sub:#6b4423;--paper:#f5ecd7;--card:#faf4e3;--border:#d4b896;--gold:#8b2500;--accent:#a0522d}
  body{background:var(--paper);color:var(--ink);margin:0;font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;line-height:1.8;overflow-x:hidden}
  .reader-wrap{max-width:820px;margin:0 auto;padding:24px 28px 120px;position:relative}
  .reader-toolbar{position:sticky;top:64px;z-index:20;background:var(--paper);border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tool-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.92em;transition:all .2s}
  .tool-btn:hover{border-color:var(--gold);color:var(--gold)}
  .tool-btn.on{background:var(--gold);color:var(--paper);border-color:var(--gold)}
  .tool-btn .badge{margin-left:4px;color:var(--gold);font-size:.8em}
  .tool-btn.on .badge{color:#ffd9b0}
  .tool-select{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.92em;cursor:pointer}
  .reader-search{flex:1;min-width:160px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.92em;outline:none}
  .reader-search:focus{border-color:var(--gold)}
  .reader-title{font-size:1.8em;font-weight:700;margin:8px 0 6px;text-align:center;letter-spacing:.1em;color:var(--ink)}
  .reader-meta{text-align:center;color:var(--sub);font-size:.9em;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .reader-content{font-size:1.08em;line-height:2.0;color:var(--ink)}
  .reader-content p{margin:0;text-indent:2em;padding:4px 0}
  .reader-content.vertical{writing-mode:vertical-rl;max-width:none;height:calc(100vh - 120px);padding:0 20px;overflow-x:auto}
  .reader-content h3,.reader-content .chapter{font-size:1.25em;font-weight:700;text-align:center;margin:32px 0 16px;color:var(--gold);letter-spacing:.1em}
  .reader-content .juanname{text-align:center;color:var(--accent);font-size:1.05em;margin:24px 0 10px;font-weight:600}
  .reader-content mark{background:#ffeb99;color:#8b2500;padding:1px 3px;border-radius:3px}
  .reader-content a.concept{color:var(--gold);border-bottom:1px dashed var(--gold);cursor:help;text-decoration:none}
  .reader-content.simplified *{font-family:'Noto Serif SC',serif}
  .font-small .reader-content{font-size:.95em}
  .font-normal .reader-content{font-size:1.08em}
  .font-large .reader-content{font-size:1.22em}
  .progress-bar{position:fixed;top:63px;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--accent));z-index:30;transition:width .2s}
  .toc-panel{position:fixed;left:-320px;top:64px;bottom:0;width:300px;background:var(--card);border-right:1px solid var(--border);z-index:40;transition:left .3s;overflow-y:auto;padding:16px}
  .toc-panel.open{left:0}
  .toc-panel h3{margin:0 0 12px;font-size:1.1em;color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .toc-item{padding:6px 10px;cursor:pointer;border-radius:6px;color:var(--ink);font-size:.94em;display:block;text-decoration:none;transition:all .15s}
  .toc-item:hover{background:rgba(139,37,0,.08);color:var(--gold)}
  .toc-item.juan{font-weight:600;color:var(--accent);margin-top:8px}
  .toc-mask{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:39;display:none}
  .toc-mask.show{display:block}
  .loader-wrap{text-align:center;padding:60px 0;color:var(--sub)}
  .spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-text{margin-top:8px;font-size:.92em}
  .err-box{text-align:center;padding:80px 0;color:var(--sub)}
  .err-box h2{color:var(--gold)}
  .err-btn{padding:10px 22px;border-radius:8px;background:var(--gold);color:var(--paper);border:none;cursor:pointer;font-family:inherit;margin:10px 6px}
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:8px;z-index:100;opacity:0;transition:opacity .3s;font-size:.94em}
  .toast.show{opacity:.95}
  @media(max-width:720px){
    .reader-wrap{padding:16px 18px 80px}
    .reader-title{font-size:1.4em}
    .toc-panel{width:260px;left:-280px}
  }
</style>
</head>
<body class="font-normal">
<div id="siteNav"></div>
<div class="progress-bar" id="progressBar" style="width:0%"></div>
<div class="toc-mask" id="tocMask" onclick="closeToc()"></div>
<div class="toc-panel" id="tocPanel"><h3>📋 篇目導航</h3><div id="tocList"></div></div>

<div class="page-wrap" style="max-width:none;padding:0">
<div class="reader-wrap">
  <div class="reader-toolbar">
    <button class="tool-btn" onclick="toggleToc()">📋 目錄</button>
    <button class="tool-btn" id="favBtn" onclick="toggleFavBtn()">☆ 收藏</button>
    <select class="tool-select" id="volSelect" style="display:none" onchange="switchVol(this.value)"></select>
    <input class="reader-search" id="bookSearch" placeholder="本書內搜索…" oninput="inBookSearch(this.value)">
    <button class="tool-btn" id="tradBtn" onclick="toggleSimp()">繁</button>
    <button class="tool-btn" onclick="decFont()">A-</button>
    <button class="tool-btn" onclick="incFont()">A+</button>
    <button class="tool-btn" id="vertBtn" onclick="toggleVert()">竪</button>
    <button class="tool-btn" onclick="citeExport()">📋 引用</button>
  </div>
  <h1 class="reader-title" id="bookTitle">載入中…</h1>
  <div class="reader-meta" id="bookMeta"></div>
  <div id="loader" class="loader-wrap"><div class="spinner"></div><div class="progress-text" id="loadText">正在連接文本…</div></div>
  <article class="reader-content" id="content" style="display:none"></article>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="js/common.js?v=4"></script>
<script>
injectLayout('library');

const params=new URLSearchParams(location.search);
const filePath=params.get('b');
const decodedPath=filePath?decodeURIComponent(filePath):'';
let rawText='',bookName='',chapters=[],curVol=0,volumes=[],isSimplified=false,isVertical=false,currentFontSize=0;
const CHUNK=60000;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

async function loadBooksInfo(){
  try{const r=await fetch('data/books.json');return await r.json();}catch(e){return null;}
}

async function init(){
  if(!decodedPath){showError('未指定書籍路徑');return;}
  bookName=decodedPath.split('/').pop().replace(/\.txt$/,'').replace(/_卷\d+$/,'');
  document.title=bookName+' · 子藏本體論';
  document.getElementById('bookTitle').textContent=bookName;

  const books=await loadBooksInfo();
  const cat=decodedPath.split('/')[0]||'';
  const fname=decodedPath.split('/').pop();
  let bookInfo=null;
  if(books){
    bookInfo=books.find(b=>(b.file===decodedPath)||(b.volumes&&b.volumes.includes(fname))||b.title===bookName);
    if(bookInfo&&bookInfo.volumes&&bookInfo.volumes.length>1){
      volumes=bookInfo.volumes.map(v=>cat+'/'+v);
      curVol=volumes.indexOf(decodedPath);
      if(curVol<0) curVol=0;
      const sel=document.getElementById('volSelect');
      sel.style.display='inline-block';
      sel.innerHTML=bookInfo.volumes.map((v,i)=>`<option value="${i}" ${i===curVol?'selected':''}>第${i+1}卷</option>`).join('');
    }
  }

  // 阅读进度
  const saved=getProgress(decodedPath);
  if(saved>0){setTimeout(()=>{window.scrollTo(0,saved);updateProgress();},300);}

  await loadText(volumes[curVol]||decodedPath);
  updateFavBtn();
  window.addEventListener('scroll',updateProgress,{passive:true});
}

async function switchVol(i){
  curVol=parseInt(i);
  document.getElementById('content').style.display='none';
  document.getElementById('loader').style.display='block';
  await loadText(volumes[curVol]);
}

async function loadText(path){
  const loader=document.getElementById('loader');
  const lt=document.getElementById('loadText');
  const ct=document.getElementById('content');
  loader.style.display='block';
  lt.textContent='正在下載文本…';

  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),60000);
  let text;
  try{
    const r=await fetch(path,{signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    lt.textContent='正在解碼文本…';
    text=await r.text();
  }catch(e){
    clearTimeout(timer);
    showError('文本加載失敗: '+e.message,path);return;
  }
  rawText=text.replace(/\r/g,'');
  // 解析篇章
  chapters=parseChapters(rawText);
  buildToc();
  // 渲染（分块异步）
  lt.textContent='正在渲染文本…';
  renderChunked(rawText);
}

function parseChapters(text){
  const chs=[]; let idx=0;
  // 识别"卷X""篇""章""第X"等标题行
  const lines=text.split('\n'); let pos=0;
  lines.forEach((line,i)=>{
    const ln=line.trim();
    if(!ln){pos+=line.length+1;return;}
    if(/^(卷[一二三四五六七八九十百千零\d]+|第[一二三四五六七八九十百千\d]+[篇卷章回節]|[一二三四五六七八九十百千]+、|\s*[【\[〔].{2,20}[】\]〕])/.test(ln)||
       /^[\u4e00-\u9fa5]{2,12}(篇|章|序|論|說|解|記|訓|傳|語|策|略)$/.test(ln)||
       (ln.length<=16 && /[篇章卷序第一二三四五六七八九十]$/.test(ln) && ln.length>1)){
      chs.push({title:ln,pos:pos,index:idx++});
    }
    pos+=line.length+1;
  });
  return chs;
}

function buildToc(){
  const list=document.getElementById('tocList');
  if(!chapters.length){list.innerHTML='<div style="color:var(--sub);font-size:.9em;padding:8px">本卷未識別到標準篇章標題，可使用書內搜索定位</div>';return;}
  list.innerHTML=chapters.map((c,i)=>{
    const isJuan=/^卷/.test(c.title);
    return `<a class="toc-item${isJuan?' juan':''}" href="#ch_${i}" onclick="jumpCh(${i})">${c.title}</a>`;
  }).join('');
}

function jumpCh(i){
  const el=document.getElementById('ch_'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  closeToc();
}
function toggleToc(){
  document.getElementById('tocPanel').classList.toggle('open');
  document.getElementById('tocMask').classList.toggle('show');
}
function closeToc(){
  document.getElementById('tocPanel').classList.remove('open');
  document.getElementById('tocMask').classList.remove('show');
}

function renderChunked(text){
  const ct=document.getElementById('content');
  const loader=document.getElementById('loader');
  const lt=document.getElementById('loadText');
  ct.innerHTML='';
  ct.style.display='block';

  // 处理篇章锚点
  let html=formatText(text);
  ct.innerHTML=html;
  loader.style.display='none';
  applyConceptHighlight(ct);
  updateProgress();
}

function formatText(text){
  const CONCEPTS=['道','无为','自然','仁','义','礼','智','信','兼爱','非攻','尚贤','法','术','势','刑名','奇正','虚实','庙算','白马非马','坚白','齐物','逍遥','性善','性恶','四端','浩然之气','仁政','王霸','义利','天人合一','知行合一','中庸','格物','致知','名实','正名'];
  const lines=text.split('\n');
  let out=''; let juanCount=0, chCount=0;
  let curJuan=0;
  lines.forEach((line,i)=>{
    const ln=line.trim();
    if(!ln) return;
    // 标记章节标题
    const chIdx=chapters.findIndex(c=>{
      const lines2=text.substring(c.pos).split('\n');
      return lines2[0]&&lines2[0].trim()===ln && text.indexOf(ln,c.pos)===c.pos;
    });
    if(chapters[chCount]&&chapters[chCount].title===ln){
      if(/^卷/.test(ln)){
        out+=`<div class="juanname" id="ch_${chCount}">${ln}</div>`;
      }else{
        out+=`<h3 id="ch_${chCount}">${ln}</h3>`;
      }
      chCount++;return;
    }
    // 段落
    let para=escapeHTML(ln);
    // 概念高亮
    CONCEPTS.forEach(c=>{
      const re=new RegExp('('+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');
      para=para.replace(re,'<a class="concept" title="子学核心概念: '+c+'">$1</a>');
    });
    out+=`<p>${para}</p>`;
  });
  return out;
}
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function applyConceptHighlight(ct){/*已在formatText处理*/}

function inBookSearch(q){
  const ct=document.getElementById('content');
  // 清除旧标记
  ct.innerHTML=ct.innerHTML.replace(/<mark>(.*?)<\/mark>/g,'$1');
  if(!q.trim()) return;
  const qs=q.trim();
  // 简单标记
  const re=new RegExp('('+qs.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  const paras=ct.querySelectorAll('p,h3,.juanname');
  let first=null; let count=0;
  paras.forEach(p=>{
    if(p.innerHTML.includes(qs)||p.innerHTML.includes(s2t(qs))||p.innerHTML.includes(t2s(qs))){
      p.innerHTML=p.innerHTML.replace(re,'<mark>$1</mark>');
      if(!first) first=p;
      count++;
    }
  });
  if(first){first.scrollIntoView({behavior:'smooth',block:'center'});toast(`找到 ${count} 處`);}
  else if(qs.length>=2) toast('本書未找到');
}

function toggleSimp(){
  isSimplified=!isSimplified;
  const ct=document.getElementById('content');
  const btn=document.getElementById('tradBtn');
  if(isSimplified){
    ct.classList.add('simplified');
    ct.innerHTML=t2s(ct.innerHTML);
    btn.textContent='简';
    btn.classList.add('on');
  }else{
    ct.classList.remove('simplified');
    // 重新加载以复原繁体
    renderChunked(rawText);
    btn.textContent='繁';
    btn.classList.remove('on');
  }
}
function incFont(){currentFontSize++;applyFont();}
function decFont(){currentFontSize--;applyFont();}
function applyFont(){
  const cls=currentFontSize<0?'font-small':currentFontSize>0?'font-large':'font-normal';
  document.body.className=cls+(isVertical?'':'');
}
function toggleVert(){
  isVertical=!isVertical;
  const ct=document.getElementById('content');
  const btn=document.getElementById('vertBtn');
  if(isVertical){ct.classList.add('vertical');btn.classList.add('on');toast('已切換豎排（鼠標橫向滾動）');}
  else{ct.classList.remove('vertical');btn.classList.remove('on');}
}
function toggleFavBtn(){
  const added=toggleFav(decodedPath,bookName);
  updateFavBtn();
  toast(added?'已加入收藏':'已取消收藏');
}
function updateFavBtn(){
  const btn=document.getElementById('favBtn');
  if(isFav(decodedPath)){btn.classList.add('on');btn.innerHTML='★ 已收藏';}
  else{btn.classList.remove('on');btn.innerHTML='☆ 收藏';}
}
function citeExport(){
  const template=`[${bookName}]//子藏本體論 Zi-Cang Ontology[EB/OL]. (2026). https://yejinlei.github.io/Zi-Cang/reader.html?b=${encodeURIComponent(decodedPath)}`;
  navigator.clipboard?.writeText(template).then(()=>toast('引用信息已複製到剪貼板')).catch(()=>{
    prompt('複製以下引用格式：',template);
  });
}
function updateProgress(){
  const h=document.documentElement;
  const pct=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
  document.getElementById('progressBar').style.width=pct+'%';
  saveProgress(decodedPath,h.scrollTop);
}
function showError(msg,path){
  document.getElementById('loader').innerHTML=`<div class="err-box">
    <h2>⚠ 無法載入文本</h2><p>${msg}</p>${path?`<p style="font-size:.85em;opacity:.7">路徑: ${escapeHTML(path)}</p>`:''}
    <button class="err-btn" onclick="history.back()">← 返回書庫</button>
    <button class="err-btn" onclick="location.reload()">重試</button>
  </div>`;
}
init();
</script>
<div id="siteFooter"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典籍詳解 | 子藏本體論</title>
<link rel="stylesheet" href="css/common.css?v=12">
<style>
  .cl-wrap { max-width:1240px; margin:0 auto; padding:24px 20px 70px; }
  .cl-head { margin-bottom:20px; }
  .cl-title { font-family:"STKaiti","KaiTi",serif; font-size:34px; color:var(--ink); letter-spacing:3px; margin-bottom:6px; }
  .cl-sub { color:var(--ink-soft); font-size:14px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin:18px 0 22px; }
  .kpi { background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .kpi-num { font-size:26px; font-weight:900; color:var(--accent); font-family:"STKaiti",serif; }
  .kpi-label { font-size:12px; color:var(--ink-soft); margin-top:4px; letter-spacing:1px; }

  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .cl-search { flex:1; min-width:220px; padding:10px 16px; border:1px solid var(--border); border-radius:10px;
    background:var(--paper); color:var(--ink); font-size:15px; outline:none; }
  .cl-search:focus { border-color:var(--accent); }
  .mode-toggle { display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .mode-toggle button { padding:9px 16px; border:none; background:var(--paper); color:var(--ink-soft); cursor:pointer; font-size:13px; font-family:"STKaiti",serif; }
  .mode-toggle button.on { background:var(--accent); color:#fff; }

  .cat-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .cat-tab { padding:7px 16px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
    background:var(--paper); color:var(--ink-soft); font-size:13px; font-family:"STKaiti",serif; transition:all .2s; }
  .cat-tab:hover { border-color:var(--accent); color:var(--accent); }
  .cat-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .cl-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .cl-card { background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    transition:all .2s; position:relative; overflow:hidden; }
  .cl-card:hover { border-color:var(--accent); box-shadow:0 6px 20px var(--shadow); }
  .cl-card.full { border-left:4px solid var(--gold); }
  .cl-card-top { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .cl-name { font-family:"STKaiti",serif; font-size:19px; font-weight:700; color:var(--ink); }
  .cl-badge { font-size:11px; padding:2px 7px; border-radius:4px; background:var(--bg-soft); color:var(--accent); white-space:nowrap; }
  .cl-badge.full { background:var(--gold); color:var(--paper); }
  .cl-author { font-size:12px; color:var(--ink-soft); }
  .cl-brief { font-size:13.5px; color:var(--ink); line-height:1.75; }
  .cl-meta { margin-top:8px; font-size:12px; color:var(--ink-soft); }
  .cl-detail { margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; display:none; }
  .cl-card.open .cl-detail { display:block; }
  .cl-detail h5 { font-size:13px; color:var(--accent); margin:10px 0 5px; letter-spacing:1px; }
  .cl-detail ul { margin:0; padding-left:18px; }
  .cl-detail li { font-size:13px; color:var(--ink); line-height:1.7; }
  .cl-quote { font-family:"STKaiti",serif; font-size:14px; color:var(--ink); border-left:3px solid var(--gold);
    padding-left:10px; margin:6px 0; line-height:1.7; }
  .cl-quote small { display:block; color:var(--ink-soft); font-size:11px; font-family:inherit; }
  .cl-actions { margin-top:10px; display:flex; gap:10px; align-items:center; }
  .cl-link { font-size:12.5px; color:var(--accent); text-decoration:none; border:1px solid var(--accent);
    padding:4px 12px; border-radius:6px; }
  .cl-link:hover { background:var(--accent); color:#fff; }
  .cl-toggle { font-size:12.5px; color:var(--ink-soft); cursor:pointer; background:none; border:none; padding:4px 0; }
  .cl-toggle:hover { color:var(--accent); }
  .more { margin:28px auto 0; display:block; padding:10px 34px; border:1px solid var(--accent); background:transparent;
    color:var(--accent); border-radius:8px; cursor:pointer; font-size:14px; font-family:"STKaiti",serif; }
  .more:hover { background:var(--accent); color:#fff; }
  .cl-tags { margin-top:8px; }
  .cl-tags span { display:inline-block; font-size:11px; padding:2px 8px; margin:2px 3px 0 0; border-radius:999px;
    background:var(--bg-soft); color:var(--accent); border:1px solid var(--border); }
  .empty { text-align:center; padding:50px; color:var(--ink-soft); }
  @media(max-width:768px){ .cl-list{grid-template-columns:1fr;} .cl-title{font-size:26px;} }
</style>
</head>
<body>
<div id="siteNav"></div>
<div class="page-wrap">
  <div class="cl-wrap">
    <div class="cl-head">
      <div class="cl-title">典籍詳解</div>
      <div class="cl-sub">子藏 1148 部典籍之提要、作者、主旨、关键概念與原文引證；其中 296 部為精編詳解，852 部為分目卡片。</div>
    </div>
    <div class="kpi-grid" id="kpi"></div>
    <div class="filter-bar">
      <input class="cl-search" id="q" placeholder="搜索書名、作者、關鍵概念、引文…">
      <div class="mode-toggle" id="mode">
        <button data-mode="all" class="on">全部</button>
        <button data-mode="full">僅精編</button>
      </div>
    </div>
    <div class="cat-tabs" id="tabs"></div>
    <div class="cl-list" id="list"></div>
    <button class="more" id="more">加載更多 ▾</button>
  </div>
</div>
<div id="siteFooter"></div>

<script src="data/people_ext.js?v=12"></script>
<script src="js/linkify.js?v=12"></script>
<script src="js/common.js?v=12"></script>
<script src="data/books.js?v=12"></script>
<script src="data/classics.js?v=12"></script>
<script>
(function(){
  var D = (window.CLASSICS_DATA||[]).slice();
  // 书目路径映射（用于「进入阅读」）
  var PMAP = {};
  if(typeof ALL_BOOKS!=='undefined'){
    ALL_BOOKS.forEach(function(b){ PMAP[b.cat+'|'+b.name] = b.path; });
  }
  var CN = {tabs:{}, list:[]};
  var state = { cat:'全部', mode:'all', q:'', page:0, size:60 };

  var CATS = ['全部','诸子','兵家','法家','农家','算学','笔记','类书'];
  var catCount = {'全部':D.length};
  D.forEach(function(c){ catCount[c.cat]=(catCount[c.cat]||0)+1; });

  document.getElementById('kpi').innerHTML =
    '<div class="kpi"><div class="kpi-num">'+D.length+'</div><div class="kpi-label">典籍總數</div></div>'+
    '<div class="kpi"><div class="kpi-num">'+D.filter(function(c){return c.tier==='full';}).length+'</div><div class="kpi-label">精編詳解</div></div>'+
    '<div class="kpi"><div class="kpi-num">'+D.filter(function(c){return c.tier==='card';}).length+'</div><div class="kpi-label">分目卡片</div></div>'+
    '<div class="kpi"><div class="kpi-num">'+(D.filter(function(c){return c.quotes&&c.quotes.length;}).reduce(function(a,c){return a+c.quotes.length;},0))+'</div><div class="kpi-label">原文引證</div></div>'+
    '<div class="kpi"><div class="kpi-num">'+(D.filter(function(c){return c.key&&c.key.length;}).reduce(function(a,c){return a+c.key.length;},0))+'</div><div class="kpi-label">關鍵論點</div></div>';

  document.getElementById('tabs').innerHTML = CATS.map(function(c){
    return '<div class="cat-tab'+(c==='全部'?' active':'')+'" data-cat="'+c+'">'+c+' <span style="opacity:.65">'+(catCount[c]||0)+'</span></div>';
  }).join('');

  function fmtChars(n){ if(!n) return ''; if(n<10000) return n+''; if(n<100000000) return (n/10000).toFixed(1)+'萬'; return (n/100000000).toFixed(2)+'億'; }

  function filtered(){
    return D.filter(function(c){
      if(state.cat!=='全部' && c.cat!==state.cat) return false;
      if(state.mode==='full' && c.tier!=='full') return false;
      if(state.q){
        var hay = (c.title+' '+(c.author||'')+' '+(c.school||'')+' '+(c.brief||'')+' '+(c.key||[]).join(' ')+' '+
                   (c.quotes||[]).map(function(q){return q.t;}).join(' ')).toLowerCase();
        if(hay.indexOf(state.q.toLowerCase())<0) return false;
      }
      return true;
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function cardHTML(c){
    var isFull = c.tier==='full';
    var path = PMAP[c.cat+'|'+c.title];
    var h = '<div class="cl-card'+(isFull?' full':'')+'" data-title="'+esc(c.title)+'">';
    h += '<div class="cl-card-top"><span class="cl-name">'+esc(c.title)+'</span>'+
         '<span class="cl-badge'+(isFull?' full':'')+'">'+esc(c.cat)+'</span>'+
         (isFull&&c.school?'<span class="cl-badge">'+linkify.text(esc(c.school))+'</span>':'')+'</div>';
    if(c.author) h += '<div class="cl-author">'+linkify.text(esc(c.author))+(c.era?' · '+esc(c.era):'')+'</div>';
    h += '<div class="cl-brief">'+linkify.text(esc(c.brief||''))+'</div>';
    h += '<div class="cl-meta">'+(c.chars?fmtChars(c.chars)+'字':'')+
         (c.volumes&&c.volumes>1?' · '+c.volumes+'卷':'')+'</div>';
    if(isFull){
      h += '<div class="cl-detail">';
      if(c.key&&c.key.length){
        h += '<h5>核心論點</h5><ul>'+c.key.map(function(k){return '<li>'+linkify.text(esc(k))+'</li>';}).join('')+'</ul>';
      }
      if(c.quotes&&c.quotes.length){
        h += '<h5>原文引證</h5>'+c.quotes.map(function(q){
          return '<div class="cl-quote">'+linkify.text(esc(q.t))+'<small>——'+linkify.text(esc(q.s))+'</small></div>';
        }).join('');
      }
      if(c.notes) h += '<h5>版本與研讀</h5><div class="cl-brief">'+linkify.text(esc(c.notes))+'</div>';
      h += '</div>';
    }
    var tags = (c.tags||[]).map(function(t){return '<span>'+esc(t)+'</span>';}).join('');
    if(tags) h += '<div class="cl-tags no-link">'+tags+'</div>';
    h += '<div class="cl-actions no-link">';
    if(path) h += '<a class="cl-link" href="reader.html?b='+encodeURIComponent(path)+'">進入閱讀 →</a>';
    if(isFull) h += '<button class="cl-toggle">展開詳解 ▾</button>';
    h += '</div></div>';
    return h;
  }

  function render(){
    var f = filtered();
    var end = Math.min((state.page+1)*state.size, f.length);
    document.getElementById('list').innerHTML = f.slice(0,end).map(cardHTML).join('') ||
      '<div class="empty">未找到匹配的典籍</div>';
    var btn = document.getElementById('more');
    if(end < f.length){ btn.style.display='block'; btn.textContent='加載更多 ▾ （'+(f.length-end)+' 部未顯示）'; }
    else btn.style.display='none';
  }

  document.getElementById('list').addEventListener('click', function(e){
    var t = e.target.closest('.cl-toggle');
    if(!t) return;
    var card = t.closest('.cl-card');
    card.classList.toggle('open');
    t.textContent = card.classList.contains('open') ? '收起詳解 ▴' : '展開詳解 ▾';
  });
  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.cat-tab'); if(!t) return;
    document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active'); state.cat=t.dataset.cat; state.page=0; render();
  });
  document.getElementById('mode').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#mode button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); state.mode=b.dataset.mode; state.page=0; render();
  });
  var qT;
  document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(qT); qT=setTimeout(function(){ state.q=e.target.value.trim(); state.page=0; render(); },180);
  });
  document.getElementById('more').addEventListener('click', function(){ state.page++; render(); });

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全文本體三維圖譜 · 子藏</title>
<link rel="stylesheet" href="css/common.css?v=27">
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%}
#canvas-wrap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#canvas-wrap canvas{display:block}
.ont-header{position:relative;z-index:10;padding:14px 28px 8px;background:linear-gradient(to bottom,rgba(245,240,225,.96),rgba(245,240,225,.75) 70%,transparent);pointer-events:none}
.ont-header > *{pointer-events:auto}
.ont-title{font-family:serif;font-size:1.5em;font-weight:700;color:var(--gold)}
.ont-sub{font-size:.85em;color:var(--muted);margin-top:2px}
.ont-legend{position:fixed;bottom:20px;left:20px;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ont-legend h4{margin:0 0 8px;font-size:.9em;font-family:serif;color:var(--gold)}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.82em;cursor:pointer;user-select:none}
.legend-item:hover{opacity:.8}
.legend-item.off{opacity:.35}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.legend-name{flex:1}
.legend-cnt{color:var(--muted);font-size:.75em}
.ont-stats{position:fixed;top:14px;right:20px;z-index:10;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.82em;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.stat-chip b{color:var(--gold);font-size:1.1em;margin:0 2px;font-family:serif}
.ont-tip{position:fixed;z-index:20;background:rgba(30,20,10,.92);color:#f5f0e1;padding:8px 14px;border-radius:6px;font-size:.85em;pointer-events:none;display:none;font-family:serif;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:260px;line-height:1.5}
.ont-detail{position:fixed;top:90px;right:20px;width:320px;max-height:calc(100vh - 120px);z-index:15;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none;overflow-y:auto}
.ont-detail.show{display:block}
.ont-detail .d-close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:1.2em;background:none;border:none}
.ont-detail .d-close:hover{color:var(--gold)}
.ont-detail .d-name{font-family:serif;font-size:1.3em;font-weight:700;color:var(--gold);margin:0 0 4px;padding-right:20px}
.ont-detail .d-en{font-size:.78em;color:var(--muted);margin-bottom:8px;font-style:italic}
.ont-detail .d-mod{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.75em;margin-bottom:10px;color:#fff}
.ont-detail .d-def{font-size:.88em;line-height:1.7;margin-bottom:12px;color:var(--text)}
.ont-detail .d-sec{font-size:.82em;color:var(--muted);margin:8px 0 4px;font-weight:600}
.ont-detail .d-link{display:block;font-size:.84em;color:var(--link);text-decoration:none;padding:3px 0}
.ont-detail .d-link:hover{color:var(--gold)}
.ont-detail .d-align{font-size:.78em;color:var(--muted);font-family:monospace;background:var(--bg);padding:6px 8px;border-radius:4px;margin-top:4px;word-break:break-all}
.ont-controls{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;flex-direction:column;gap:8px}
.ctrl-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:1.1em;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;font-family:serif;color:var(--gold);font-size:1.1em}
@media(max-width:768px){
 .ont-detail{width:calc(100% - 40px);right:20px;top:80px;max-height:60vh}
 .ont-legend{max-width:180px;padding:8px 10px}
 .stat-chip{padding:4px 10px;font-size:.75em}
}
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div class="loading" id="loading">正在構建本體星圖…</div>

<div class="ont-header">
 <div class="ont-title">子藏本體三維星圖</div>
 <div class="ont-sub">Zi-Cang Ontology · 3D Knowledge Graph · 拖拽旋轉 · 滾輪縮放 · 點擊查看詳情</div>
</div>

<div class="ont-stats" id="stats"></div>

<div class="ont-legend" id="legend">
 <h4>模塊圖例</h4>
</div>

<div class="ont-controls">
 <button class="ctrl-btn" id="btn-reset" title="重置視角">⟲</button>
 <button class="ctrl-btn" id="btn-zoom-in" title="放大">+</button>
 <button class="ctrl-btn" id="btn-zoom-out" title="縮小">−</button>
 <button class="ctrl-btn" id="btn-labels" title="切換標籤">A</button>
</div>

<div class="ont-tip" id="tip"></div>

<div class="ont-detail" id="detail">
 <button class="d-close" id="detail-close">×</button>
 <div class="d-name" id="d-name"></div>
 <div class="d-en" id="d-en"></div>
 <span class="d-mod" id="d-mod"></span>
 <div class="d-def" id="d-def"></div>
 <div class="d-sec">父類</div>
 <div id="d-parent"></div>
 <div class="d-sec">子類</div>
 <div id="d-children"></div>
 <div class="d-sec">外部對齊</div>
 <div class="d-align" id="d-align"></div>
</div>

<script src="js/common.js?v=27"></script>
<script src="data/ontology-schema.js?v=27"></script>
<script type="importmap">
{
 "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
 }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ 数据准备 ============
const schema = window.ONTOLOGY_SCHEMA;
const classes = schema.classes;
const modules = schema.meta.modules;

// 模块配色（与主题契合）
const MOD_COLORS = {
 zcore: 0xC49A3C,   // 金色 - 核心顶层
 zbib:  0x8B5A2B,   // 棕色 - 文献目录
 zcon:  0x5C8C5C,   // 青绿 - 概念论证
 zsch:  0x7B68A8,   // 紫色 - 学派师承
 zhev:  0xA0522D,   // 赭色 - 历史事件
 zexe:  0x4682B4    // 钢蓝 - 注疏训诂
};
const MOD_COLORS_CSS = {
 zcore: '#C49A3C',
 zbib:  '#8B5A2B',
 zcon:  '#5C8C5C',
 zsch:  '#7B68A8',
 zhev:  '#A0522D',
 zexe:  '#4682B4'
};

// 建立类索引、children 映射、深度
const classMap = {};
const childMap = {};
const depthMap = {};
const modCount = {};
classes.forEach(c => {
 classMap[c.id] = c;
 childMap[c.id] = [];
 modCount[c.mod] = (modCount[c.mod]||0)+1;
});
classes.forEach(c => {
 if(c.parent && classMap[c.parent]){
  childMap[c.parent].push(c.id);
 }
});
// 计算每个类的继承深度
function calcDepth(id, d=0){
 if(depthMap[id]!=null) return depthMap[id];
 const c = classMap[id];
 if(!c || !c.parent || !classMap[c.parent]){ depthMap[id]=d; return d; }
 depthMap[id] = calcDepth(c.parent, d+1);
 return depthMap[id];
}
classes.forEach(c => calcDepth(c.id));

// ============ 构建图例与统计 ============
const legendEl = document.getElementById('legend');
const modVisibility = {};
modules.forEach(m => {
 modVisibility[m.id] = true;
 const item = document.createElement('div');
 item.className = 'legend-item';
 item.dataset.mod = m.id;
 item.innerHTML = `<span class="legend-dot" style="background:${MOD_COLORS_CSS[m.id]}"></span><span class="legend-name">${m.cn}</span><span class="legend-cnt">${modCount[m.id]||0}</span>`;
 item.onclick = () => {
  modVisibility[m.id] = !modVisibility[m.id];
  item.classList.toggle('off', !modVisibility[m.id]);
  applyModuleFilter();
 };
 legendEl.appendChild(item);
});

document.getElementById('stats').innerHTML = `
 <div class="stat-chip">類 <b>${classes.length}</b></div>
 <div class="stat-chip">屬性 <b>${(schema.objectProperties||[]).length + (schema.dataProperties||[]).length}</b></div>
 <div class="stat-chip">模塊 <b>${modules.length}</b></div>
 <div class="stat-chip">規則 <b>${(schema.rules||[]).length}</b></div>
`;

// ============ Three.js 初始化 ============
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
// 根据当前主题设置背景
function updateBg(){
 const s = getComputedStyle(document.documentElement);
 const bg = s.getPropertyValue('--bg').trim() || '#F5F0E1';
 scene.background = new THREE.Color(bg);
}
updateBg();
// 监听主题变化
const mo = new MutationObserver(()=>updateBg());
mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','style']});

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 80);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 15;
controls.maxDistance = 200;

// ============ 灯光 ============
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dir = new THREE.DirectionalLight(0xffffff, 0.6);
dir.position.set(20,30,40);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xd4af37, 0.3);
dir2.position.set(-20,-10,-20);
scene.add(dir2);

// ============ 节点布局 ============
// 中心 Thing -> 6 个模块环形分布 -> 模块内按深度径向分层 + 角度扰动
const nodeGroup = new THREE.Group();
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
scene.add(nodeGroup);

const nodeMeshes = [];       // {mesh, id, mod, label}
const edgeMeshes = [];
const idToNode = {};
const idToPos = {};
const idToLabel = {};

// 6个模块的中心角度
const modAngleStep = (Math.PI*2)/modules.length;
const modRadius = 18;         // 模块中心距中心距离
const depthStep = 7;          // 每层深度向外扩展
const nodeSize = 0.9;

// 创建 Thing（根节点）放在正中心
const rootGeo = new THREE.SphereGeometry(2.2, 32, 24);
const rootMat = new THREE.MeshStandardMaterial({
 color: 0xD4AF37, emissive:0x8B6914, emissiveIntensity:0.4,
 metalness:0.3, roughness:0.5
});
const rootMesh = new THREE.Mesh(rootGeo, rootMat);
rootMesh.position.set(0,0,0);
nodeGroup.add(rootMesh);
idToNode['zc:Thing'] = rootMesh;
idToPos['zc:Thing'] = new THREE.Vector3(0,0,0);
rootMesh.userData = {id:'zc:Thing', cn:'事物', mod:'zcore', isRoot:true};
nodeMeshes.push(rootMesh);

// 创建根节点发光光环
const ringGeo = new THREE.RingGeometry(3, 3.4, 64);
const ringMat = new THREE.MeshBasicMaterial({color:0xD4AF37, transparent:true, opacity:0.4, side:THREE.DoubleSide});
const ring = new THREE.Mesh(ringGeo, ringMat);
nodeGroup.add(ring);

// 模块计数：每个模块内每个深度有多少节点
const modDepthCount = {};
modules.forEach((m,i) => {
 modDepthCount[m.id] = {};
});
classes.forEach(c => {
 if(c.id==='zc:Thing') return;
 const d = depthMap[c.id]||0;
 const k = c.mod;
 if(!modDepthCount[k]) modDepthCount[k]={};
 modDepthCount[k][d] = (modDepthCount[k][d]||0)+1;
});
// 每个模块、每个深度当前已放置的计数
const modDepthPlaced = {};
modules.forEach(m => modDepthPlaced[m.id]={});

// 为每个节点分配位置
function placeNode(c){
 if(c.id==='zc:Thing') return;
 if(idToPos[c.id]) return;
 // 先确保 parent 已经放置
 if(c.parent && classMap[c.parent] && !idToPos[c.parent]){
  placeNode(classMap[c.parent]);
 }
 const modIdx = modules.findIndex(m=>m.id===c.mod);
 const modAngle = modIdx * modAngleStep - Math.PI/2; // 顶部开始
 const d = depthMap[c.id]||0;
 
 // 模块中心位置
 const mx = Math.cos(modAngle)*modRadius;
 const mz = Math.sin(modAngle)*modRadius;
 const my = 0;
 
 // 深度偏移（径向，朝远离中心方向的扇形内分布）
 const r = d*depthStep + 4;
 // 扇形角度范围：每个模块占据 modAngle±30度
 const fanSpread = Math.PI/5; // 36度
 modDepthPlaced[c.mod][d] = modDepthPlaced[c.mod][d]||0;
 const cnt = modDepthCount[c.mod][d]||1;
 const idx = modDepthPlaced[c.mod][d]++;
 const t = cnt===1 ? 0.5 : idx/(cnt-1); // 0~1
 const a = modAngle + (t-0.5)*fanSpread;
 
 // 加一点z轴方向的随机偏移让3D感更强
 const jitter = (Math.sin(c.id.charCodeAt(0)+c.id.length*1.7))*1.5;
 const yOffset = jitter + (d%2===0?1:-1)*(d*0.5);
 
 const x = mx + Math.cos(a)*r;
 const z = mz + Math.sin(a)*r;
 const y = my + yOffset;
 
 idToPos[c.id] = new THREE.Vector3(x,y,z);
}
// 按深度从小到大放置，保证parent先到位
const sorted = [...classes].sort((a,b)=>depthMap[a.id]-depthMap[b.id]);
sorted.forEach(c => placeNode(c));

// ============ 创建节点 mesh ============
sorted.forEach(c => {
 if(c.id==='zc:Thing') return;
 const pos = idToPos[c.id];
 const color = MOD_COLORS[c.mod]||0x888888;
 const geo = new THREE.SphereGeometry(nodeSize, 24, 18);
 const mat = new THREE.MeshStandardMaterial({
  color:color, emissive:color, emissiveIntensity:0.15,
  metalness:0.2, roughness:0.6
 });
 const mesh = new THREE.Mesh(geo, mat);
 mesh.position.copy(pos);
 mesh.userData = {id:c.id, cn:c.cn, mod:c.mod, def:c.def, en:c.en, parent:c.parent, align:c.align};
 nodeGroup.add(mesh);
 idToNode[c.id] = mesh;
 nodeMeshes.push(mesh);
 
 // 文字标签（Sprite）
 const label = makeLabel(c.cn, color);
 label.position.copy(pos).add(new THREE.Vector3(0,1.5,0));
 label.userData = {forId:c.id};
 nodeGroup.add(label);
 idToLabel[c.id] = label;
});
// 根节点标签
const rootLabel = makeLabel('事物 Thing', 0xD4AF37, 1.3);
rootLabel.position.set(0,3,0);
nodeGroup.add(rootLabel);

function makeLabel(text, color, scale=1){
 const canvas = document.createElement('canvas');
 const ctx = canvas.getContext('2d');
 canvas.width = 256; canvas.height = 64;
 ctx.fillStyle = 'rgba(0,0,0,0)';
 ctx.fillRect(0,0,256,64);
 ctx.font = 'bold 32px "Noto Serif SC", "Source Han Serif SC", serif';
 ctx.fillStyle = '#' + new THREE.Color(color).getHexString();
 ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.strokeStyle = 'rgba(245,240,225,0.9)';
 ctx.lineWidth=4;
 ctx.strokeText(text,128,32);
 ctx.fillText(text,128,32);
 const tex = new THREE.CanvasTexture(canvas);
 tex.minFilter = THREE.LinearFilter;
 const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
 const sp = new THREE.Sprite(mat);
 sp.scale.set(6*scale, 1.5*scale, 1);
 return sp;
}

// ============ 创建继承关系连线 ============
const edges = [];
classes.forEach(c => {
 if(c.parent && classMap[c.parent] && idToPos[c.id] && idToPos[c.parent]){
  edges.push({from:c.parent, to:c.id, type:'subClass'});
 }
});

// 对象属性的跨模块关系（选主要的，避免太多线）
const crossLinks = [];
const keyProps = ['authorOf','discusses','influences','belongsToSchool','annotates','hasPart','workInPeriod','locatedIn'];
if(schema.objectProperties){
 schema.objectProperties.forEach(p => {
  // 仅画有 domain/range 的核心属性示例，避免线太多
  if(p.domain && p.range && keyProps.includes(p.localName || p.id.split(':').pop())){
   // 不作为节点间连线画（会太多），保留在详情面板显示
  }
 });
}

edges.forEach(e => {
 const from = idToPos[e.from], to = idToPos[e.to];
 if(!from||!to) return;
 const geo = new THREE.BufferGeometry().setFromPoints([from,to]);
 const fromC = classMap[e.from], toC = classMap[e.to];
 const sameMod = fromC && toC && fromC.mod===toC.mod;
 const color = sameMod ? MOD_COLORS[toC.mod] : 0x888888;
 const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity:0.45});
 const line = new THREE.Line(geo, mat);
 line.userData = {fromId:e.from, toId:e.to, mod:toC?toC.mod:'zcore'};
 edgeGroup.add(line);
 edgeMeshes.push(line);
});

// ============ 模块外环 ============
modules.forEach((m,i) => {
 const ang = i*modAngleStep - Math.PI/2;
 const r = modRadius;
 const x = Math.cos(ang)*r, z = Math.sin(ang)*r;
 // 模块标识点
 const g = new THREE.SphereGeometry(1.2, 24, 16);
 const mat = new THREE.MeshStandardMaterial({
  color:MOD_COLORS[m.id], emissive:MOD_COLORS[m.id], emissiveIntensity:0.5,
  metalness:0.4, roughness:0.4
 });
 const mesh = new THREE.Mesh(g, mat);
 mesh.position.set(x,0,z);
 mesh.userData = {isModule:true, mod:m.id, cn:m.cn, desc:m.desc};
 nodeGroup.add(mesh);
 // 模块标签
 const lbl = makeLabel(m.cn, MOD_COLORS[m.id], 1.1);
 lbl.position.set(x,2.2,z);
 nodeGroup.add(lbl);
 // 模块间淡色连线
 if(i>0){
  const pang = (i-1)*modAngleStep - Math.PI/2;
  const px=Math.cos(pang)*r, pz=Math.sin(pang)*r;
  const cgeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(px,0,pz),new THREE.Vector3(x,0,z)]);
  const cmat = new THREE.LineDashedMaterial({color:MOD_COLORS[m.id], transparent:true, opacity:0.2, dashSize:0.5, gapSize:0.3});
  const cline = new THREE.Line(cgeo,cmat);
  cline.computeLineDistances();
  edgeGroup.add(cline);
 }
});
// 闭合环形线
{
 const a0 = -Math.PI/2;
 const a1 = (modules.length-1)*modAngleStep - Math.PI/2;
 const cgeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(Math.cos(a1)*modRadius,0,Math.sin(a1)*modRadius),
  new THREE.Vector3(Math.cos(a0)*modRadius,0,Math.sin(a0)*modRadius)
 ]);
 const cmat = new THREE.LineDashedMaterial({color:MOD_COLORS.zcore, transparent:true, opacity:0.2, dashSize:0.5, gapSize:0.3});
 const cline = new THREE.Line(cgeo,cmat);
 cline.computeLineDistances();
 edgeGroup.add(cline);
}

// ============ Raycaster 交互 ============
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;
let selected = null;
const tip = document.getElementById('tip');
const detail = document.getElementById('detail');

renderer.domElement.addEventListener('mousemove', e => {
 mouse.x = (e.clientX/window.innerWidth)*2-1;
 mouse.y = -(e.clientY/window.innerHeight)*2+1;
 tip.style.left = (e.clientX+14)+'px';
 tip.style.top = (e.clientY+14)+'px';
});
renderer.domElement.addEventListener('click', () => {
 if(hovered){
  showDetail(hovered.userData);
 }
});

function showDetail(ud){
 if(ud.isModule){
  document.getElementById('d-name').textContent = ud.cn + ' 模塊';
  document.getElementById('d-en').textContent = ud.mod;
  document.getElementById('d-mod').textContent = '模塊';
  document.getElementById('d-mod').style.background = MOD_COLORS_CSS[ud.mod];
  document.getElementById('d-def').textContent = ud.desc;
  document.getElementById('d-parent').innerHTML = '<span style="color:var(--muted);font-size:.85em">本體模塊</span>';
  const mclasses = classes.filter(c=>c.mod===ud.mod);
  document.getElementById('d-children').innerHTML = mclasses.map(c=>
   `<a class="d-link" data-cid="${c.id}" href="javascript:void(0)">${c.cn} <small style="color:var(--muted)">${c.id.split(':')[1]}</small></a>`
  ).join('');
  document.getElementById('d-align').textContent = '—';
 } else {
  const c = classMap[ud.id];
  if(!c) return;
  document.getElementById('d-name').textContent = c.cn;
  document.getElementById('d-en').textContent = c.en + ' · ' + c.id;
  document.getElementById('d-mod').textContent = modules.find(m=>m.id===c.mod)?.cn || c.mod;
  document.getElementById('d-mod').style.background = MOD_COLORS_CSS[c.mod]||'#888';
  document.getElementById('d-def').textContent = c.def || '（無定義）';
  // parent
  if(c.parent && classMap[c.parent]){
   const p = classMap[c.parent];
   document.getElementById('d-parent').innerHTML = `<a class="d-link" data-cid="${c.parent}" href="javascript:void(0)">${p.cn} <small style="color:var(--muted)">${p.id.split(':')[1]}</small></a>`;
  } else {
   document.getElementById('d-parent').innerHTML = '<span style="color:var(--muted);font-size:.85em">（頂層類）</span>';
  }
  // children
  const ch = childMap[c.id]||[];
  if(ch.length){
   document.getElementById('d-children').innerHTML = ch.map(cid=>{
    const cc = classMap[cid];
    return `<a class="d-link" data-cid="${cid}" href="javascript:void(0)">${cc.cn} <small style="color:var(--muted)">${cid.split(':')[1]}</small></a>`;
   }).join('');
  } else {
   document.getElementById('d-children').innerHTML = '<span style="color:var(--muted);font-size:.85em">（無子類）</span>';
  }
  document.getElementById('d-align').textContent = c.align || '—';
 }
 detail.classList.add('show');
 // 绑定链接跳转
 detail.querySelectorAll('.d-link[data-cid]').forEach(a=>{
  a.onclick = ()=>{
   const cid = a.dataset.cid;
   if(idToNode[cid]){
    showDetail(idToNode[cid].userData);
    focusOnNode(idToNode[cid]);
   }
  };
 });
}

function focusOnNode(mesh){
 // 平滑移动相机到目标节点附近
 const target = mesh.position.clone();
 controls.target.copy(target);
}

document.getElementById('detail-close').onclick = ()=>detail.classList.remove('show');

// ============ 模块筛选 ============
function applyModuleFilter(){
 nodeMeshes.forEach(n => {
  const ud = n.userData;
  const mod = ud.mod;
  const vis = modVisibility[mod] !== false;
  n.visible = vis;
  if(ud.id && idToLabel[ud.id]) idToLabel[ud.id].visible = vis && labelsOn;
 });
 edgeMeshes.forEach(l => {
  const mod = l.userData.mod;
  l.visible = modVisibility[mod] !== false;
 });
}

// ============ 控制按钮 ============
let labelsOn = true;
document.getElementById('btn-reset').onclick = ()=>{
 camera.position.set(0,0,80);
 controls.target.set(0,0,0);
 controls.update();
};
document.getElementById('btn-zoom-in').onclick = ()=>{
 camera.position.multiplyScalar(0.8);
};
document.getElementById('btn-zoom-out').onclick = ()=>{
 camera.position.multiplyScalar(1.25);
};
document.getElementById('btn-labels').onclick = ()=>{
 labelsOn = !labelsOn;
 Object.values(idToLabel).forEach(l=>l.visible=labelsOn);
 rootLabel.visible = labelsOn;
};

// ============ 响应式 ============
window.addEventListener('resize', ()=>{
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ 动画循环 ============
const clock = new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t = clock.getElapsedTime();
 // 根节点光环旋转
 if(ring){
  ring.rotation.z = t*0.5;
  ring.scale.setScalar(1 + Math.sin(t*2)*0.05);
 }
 // 节点缓慢悬浮
 nodeMeshes.forEach((m,i)=>{
  m.position.y = idToPos[m.userData.id]?.y + Math.sin(t*0.8+i*0.3)*0.15 || 0;
 });
 // Raycast 检测 hover
 ray.setFromCamera(mouse, camera);
 const hits = ray.intersectObjects(nodeMeshes);
 if(hits.length){
  const obj = hits[0].object;
  if(hovered!==obj){
   if(hovered){
    hovered.scale.setScalar(1);
    hovered.material.emissiveIntensity = hovered.userData.isRoot?0.4:0.15;
   }
   hovered = obj;
   obj.scale.setScalar(1.5);
   obj.material.emissiveIntensity = 0.8;
   const ud = obj.userData;
   if(ud.isModule){
    tip.innerHTML = `<b>${ud.cn}模塊</b><br><span style="opacity:.75;font-size:.82em">${ud.desc}</span>`;
   } else {
    const c = classMap[ud.id];
    tip.innerHTML = `<b>${c.cn}</b> <small style="opacity:.6">${c.id}</small><br><span style="opacity:.75;font-size:.82em">${(c.def||'').slice(0,60)}…</span>`;
   }
   tip.style.display='block';
   document.body.style.cursor='pointer';
  }
 } else {
  if(hovered){
   hovered.scale.setScalar(1);
   hovered.material.emissiveIntensity = hovered.userData.isRoot?0.4:0.15;
   hovered = null;
   tip.style.display='none';
   document.body.style.cursor='default';
  }
 }
 controls.update();
 renderer.render(scene, camera);
}

// 隐藏加载提示
document.getElementById('loading').style.display='none';
animate();
</script>
</body>
</html>
